<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<title>Lisy Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
/* Layout: one-screen app, sticky scan header, scrolling body, fixed tab bar */
:root{
  --bg:#111418; --panel:#1b2026; --panel2:#232a31; --line:#2f3740;
  --fg:#e9edf1; --muted:#8d98a4; --accent:#f5a623; --accent-ink:#1a1204;
  --buy:#22c55e; --skip:#e5534b; --warn:#eab308; --blue:#38bdf8; --pink:#ec4899; --teal:#2dd4bf;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;padding:12px max(14px,env(safe-area-inset-left,0px)) 24px max(14px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font:700 22px/1.1 var(--display);letter-spacing:.02em;margin:4px 0 10px;text-transform:uppercase}

/* tab bar */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}

/* scanner */
.toprow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:9px;overflow:hidden}
.seg button{padding:5px 12px;font:700 15px var(--display);letter-spacing:.06em;color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tokens{margin-left:auto;padding:5px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--muted)}
.verdict{display:grid;grid-template-columns:1fr 1.2fr 1fr;border-radius:12px;overflow:hidden;background:var(--panel2)}
.verdict>div{padding:14px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:3px}
.verdict>div+div{border-left:1px solid rgba(0,0,0,.25)}
.verdict.buy{background:var(--buy);color:#05230f}
.verdict.skip{background:var(--skip);color:#2a0705}
.verdict.buy .label,.verdict.skip .label{color:inherit;opacity:.8}
.big{font:700 30px/1 var(--display)}
.vword{font:700 38px/1 var(--display);letter-spacing:.04em}
.why{font-size:12px;font-weight:600;opacity:.9}
.costin{background:rgba(0,0,0,.18);border:0;text-align:center;font:700 26px var(--display);padding:2px;color:inherit;width:90%;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.stats>div{background:var(--panel);padding:10px 6px;text-align:center}
.stats .v{font:700 24px/1.1 var(--display)}
.stats small{color:var(--muted);font-size:12px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-radius:10px;overflow:hidden}
.prices>div{padding:7px 4px;text-align:center}
.prices .h{font:700 15px var(--display);letter-spacing:.08em}
.prices .p{background:var(--panel);font-size:17px;padding:9px 4px}
.target{font-size:12px;font-weight:600;opacity:.85;font-family:var(--mono)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px;background:var(--panel)}
.tiles>div{padding:9px 6px;text-align:center;min-width:0}
.tiles>div+div{border-left:1px solid var(--line)}
.tiles .k{font:700 13px var(--display);letter-spacing:.1em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles .v{font:700 22px/1.15 var(--display)}
.tiles .d{font-size:12px;font-weight:700}
.range{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.range .bar{position:relative;height:10px;margin:6px 0 4px}
.range .track{position:absolute;inset:4px 0;height:2px;background:var(--line)}
.range .fill{position:absolute;top:0;height:10px;border-radius:99px;background:var(--blue);opacity:.85}
.range .mark{position:absolute;top:-5px;width:3px;height:20px;border-radius:2px;background:var(--buy)}
.sellbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:rgba(34,197,94,.08);border-top:1px solid var(--line)}
.sellbar .amt{font:700 22px var(--display);color:var(--buy)}
.sellbar .src{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font:700 14px var(--display);color:var(--accent)}
.offcols{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);max-height:300px;overflow-y:auto}
.offcol{min-width:0}
.offcol+.offcol{border-left:1px solid var(--line)}
.oc{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-top:1px solid var(--line);margin:0 4px}
.oc:first-child{border-top:0}
.oc .pr{font:600 18px var(--display);font-variant-numeric:tabular-nums}
.oc.sell{border:2px solid var(--buy);border-radius:9px;color:var(--buy)}
.cc{font:700 11px var(--display);letter-spacing:.06em;background:var(--panel2);color:var(--muted);border-radius:5px;padding:2px 5px}
.cc.fbm{opacity:.8}
.offers{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.offtabs{display:grid;grid-template-columns:repeat(3,1fr)}
.offtabs button{padding:9px 4px;font:700 16px var(--display);letter-spacing:.08em;color:#111;opacity:.55}
.offtabs button[aria-pressed="true"]{opacity:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.offlist{background:var(--panel);max-height:260px;overflow-y:auto}
.offrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.offrow:first-child{border-top:0}
.offrow .pr{font:700 18px var(--display)}
.badge{font:700 11px var(--display);letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.badge.fba{background:var(--accent);color:var(--accent-ink)}
.offhead{display:flex;align-items:center;gap:8px;margin-top:12px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none;background:var(--panel)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.prod{display:flex;gap:12px;margin-top:14px;align-items:flex-start}
.prod img{width:76px;height:96px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.prod .t{font-weight:600;font-size:17px;line-height:1.25}
.prod .meta{color:var(--muted);font-size:13px;margin-top:3px}
.asin{color:var(--accent);font-weight:700}
.matches{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.matches button{text-align:left;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{padding:12px;border-radius:10px;font-weight:700;background:var(--panel2);border:1px solid var(--line);text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scanbar{display:flex;gap:8px;align-items:center;border:2px solid var(--accent);border-radius:14px;padding:6px 6px 6px 12px;background:var(--panel);margin-top:14px}
.scanbar input{border:0;background:none;padding:6px 0;font-size:17px}
.scanbar input:focus-visible{outline:none}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.round.vis{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.vis-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:4px}
.vis-card img{max-height:180px;border-radius:8px;display:block;margin:0 auto 10px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.hit{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border-top:1px solid var(--line)}
.hit:first-child{border-top:0}
.hit img{width:40px;height:54px;object-fit:contain;background:#fff;border-radius:4px;flex:none}
.hit .t{font-weight:600;line-height:1.25}
.round.cam{background:var(--accent);color:var(--accent-ink)}
.round svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:700 22px var(--display);text-transform:uppercase;margin-bottom:4px}
.err{background:rgba(229,83,75,.12);border:1px solid var(--skip);color:#ffb4ae;padding:10px 12px;border-radius:10px;margin-top:10px;font-size:14px}
.note{color:var(--muted);font-size:13px}

/* camera overlay */
.cam-wrap{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.cam-wrap video{flex:1;width:100%;object-fit:cover;min-height:0}
.reticle{position:absolute;left:10%;right:10%;top:32.5%;height:35%;border:3px solid var(--accent);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.camres{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;color:#111;background:#9aa3ad;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.camres.buy{background:var(--buy);color:#05230f}.camres.skip{background:var(--skip);color:#2a0705}.camres.wait{background:var(--panel2);color:var(--fg)}
.camres .w{font:700 34px/1 var(--display);grid-row:span 2}
.camres .p{font:700 26px/1 var(--display);text-align:right;grid-row:span 2}
.camres .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.camres .s{font-size:13px;font-weight:600;opacity:.85}
.cam-bar .btn{padding:9px 12px;font-size:14px}
#contBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cam-bar{gap:8px;display:flex;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:#000;color:#fff}

/* chart sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));overflow-y:auto}
.sheet-head{display:flex;gap:10px;align-items:center}
.sheet-head .t{flex:1;min-width:0;font:700 20px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ser{padding:5px 10px;border-radius:999px;border:1.5px solid var(--c);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;opacity:.45}
.ser::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.ser[aria-pressed="true"]{opacity:1}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:12px}
canvas{width:100%;height:320px;display:block;touch-action:none}
.readout{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:44px}

/* lists & settings */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.row .grow{flex:1;min-width:0}
.tag{font:700 12px var(--display);letter-spacing:.08em;padding:2px 7px;border-radius:5px}
.tag.buy{background:var(--buy);color:#05230f}.tag.skip{background:var(--skip);color:#2a0705}
.trig{border-left:4px solid var(--buy)}
.trig.yellow{border-left-color:var(--warn)}.trig.red{border-left-color:var(--skip)}
.trig-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.trig-grid label,.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.pair{display:flex;gap:6px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{left:23px}
table.ev{width:100%;border-collapse:collapse;font-size:14px}
table.ev td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.ev input{text-align:center;padding:6px}
table.ev small{color:var(--muted);display:block}
.mini{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:60}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-tab="scan" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Scanner</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>History</button>
  <button data-tab="inventory"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 14h4"/></svg>Inventory</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>Settings</button>
</nav>
</div>

<div class="cam-wrap" id="cam" hidden>
  <video id="video" autoplay playsinline muted></video>
  <div class="reticle"></div>
  <button class="camres" id="camRes" hidden></button>
  <div class="cam-bar"><span id="camHint" style="flex:1">Point at the barcode</span>
    <button class="btn" id="contBtn" aria-pressed="false">Continuous: Off</button>
    <button class="btn" id="camClose">Done</button></div>
</div>

<div class="sheet" id="sheet" hidden></div>

<script>
/* ============ error banner: show any script error on screen ============ */
function showFatal(msg){
  let b = document.getElementById("fatal");
  if (!b){ b = document.createElement("div"); b.id = "fatal"; b.className = "err"; b.style.cssText = "position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:99"; b.onclick = () => b.remove(); document.body.appendChild(b); }
  b.textContent = "App error: " + msg + "  (tap to close, screenshot it for Claude)";
}
window.addEventListener("error", e => showFatal((e.message||"unknown") + (e.lineno ? " @ line " + e.lineno : "")));
window.addEventListener("unhandledrejection", e => showFatal(String(e.reason && (e.reason.message || e.reason))));

/* ============ storage ============ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("scout."+k); return v==null ? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("scout."+k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULT_TRIGGERS = [
  {name:"Fast Mover",        on:true, color:"green",  rMin:1,       rMax:250000,   pMin:24, pMax:9999, minProfit:4},
  {name:"Slow Mover",        on:true, color:"green",  rMin:1,       rMax:250000,   pMin:6,  pMax:23,   minProfit:7},
  {name:"Good Mover",        on:true, color:"green",  rMin:250000,  rMax:1000000,  pMin:24, pMax:9999, minProfit:5},
  {name:"Solid Buy",         on:true, color:"green",  rMin:1000000, rMax:3000000,  pMin:12, pMax:9999, minProfit:7},
  {name:"Lowest Price Check",on:true, color:"yellow", rMin:1000000, rMax:3000000,  pMin:6,  pMax:9999, minProfit:7},
  {name:"Lowest Price Check",on:true, color:"yellow", rMin:3000000, rMax:6000000,  pMin:3,  pMax:9999, minProfit:20},
  {name:"Exclude Trigger",   on:true, color:"red",    rMin:6000000, rMax:100000000,pMin:100,pMax:101, minProfit:10000}
];
const DEFAULT_EV = [
  {key:"daily",   label:"Daily or every other day", sub:"137 or more sales a year", pct:90, keep:2},
  {key:"weekly",  label:"Weekly or twice a week",   sub:"35 to 136 sales a year",   pct:75, keep:3},
  {key:"monthly", label:"Monthly or twice a month", sub:"10 to 34 sales a year",    pct:60, keep:5},
  {key:"quarter", label:"Quarterly or twice a quarter", sub:"3 to 9 sales a year",  pct:40, keep:8},
  {key:"few",     label:"A few times a year",       sub:"1 or 2 sales a year",      pct:20, keep:null},
  {key:"none",    label:"None this year",           sub:"ranked, but quiet for a year", pct:10, keep:null},
  {key:"norank",  label:"No sales rank at all",     sub:"no rank at all",           pct:5,  keep:null}
];
const S = {
  key:      LS.get("key",""),
  mode:     LS.get("mode","triggers"),     // triggers | ev
  cond:     LS.get("cond","used"),         // used | new
  triggers: LS.get("triggers", DEFAULT_TRIGGERS),
  ev:       LS.get("ev", DEFAULT_EV),
  inbound:  LS.get("inbound", 0.40),       // $/lb to ship into FBA
  prep:     LS.get("prep", 0.00),          // per-unit prep cost
  defCost:  LS.get("defCost", 0.00),
  buybox:   LS.get("buybox", true),        // costs +2 Keepa tokens
  autoOffers: LS.get("autoOffers", false),
  cont:     LS.get("cont", false),         // continuous scan
  ladder:   LS.get("ladder", true),        // triggers fall through to slower tiers
  roi:      LS.get("roi", {minProfit:5, minRoi:50, maxRank:6000000, minPulse:6}), // live offers cost ~12 tokens per scan
  history:  LS.get("history", []),
  inv:      LS.get("inv", []),
  tokens:   LS.get("tokens", null)
};
// pulse max of 186 (from the old app) cut off the fastest sellers; treat it as no upper limit
S.triggers.forEach(t => { if (t.pMax === 186) t.pMax = 9999; });
// add the Slow Mover trigger to saved settings once, right after Fast Mover
if (!LS.get("addedSlow", false)){
  if (!S.triggers.some(t => t.name === "Slow Mover")){
    const i = S.triggers.findIndex(t => t.name === "Fast Mover");
    S.triggers.splice(i >= 0 ? i+1 : 0, 0, {name:"Slow Mover",on:true,color:"green",rMin:1,rMax:250000,pMin:6,pMax:23,minProfit:7});
  }
  LS.set("addedSlow", true); LS.set("triggers", S.triggers);
}
function save(){ for (const k of ["key","mode","cond","triggers","ev","inbound","prep","defCost","buybox","autoOffers","cont","ladder","roi","history","inv","tokens"]) LS.set(k, S[k]); }

/* ============ helpers ============ */
const $ = s => document.querySelector(s);

const cents = v => v==null || v<=0 ? null : v/100;

/* ============ Keepa ============ */
let current = null;   // {product, matches, cost, calc}
let busy = false;

let lookupCtl = null;
async function keepaTokens(){
  // free call: tokens left and refill rate
  try{
    const r = await fetch("https://api.keepa.com/token?key="+encodeURIComponent(S.key), {cache:"no-store"});
    const j = await r.json();
    if (j.tokensLeft!=null){ S.tokens = j.tokensLeft; save(); }
    return j;
  }catch(e){ return null; }
}
async function lookup(raw){
  const q = String(raw||"").trim().replace(/[^0-9A-Za-z]/g,"").toUpperCase();
  if (!q) return;
  if (!S.key){ renderScan("Add your Keepa API key in Settings first."); return; }
  if (lookupCtl) lookupCtl.abort();          // drop any lookup still hanging
  const ctl = lookupCtl = new AbortController();
  const timer = setTimeout(() => ctl.abort("timeout"), 20000);
  visual = null;
  busy = true; renderScan();
  const t0 = Date.now();
  const secTimer = setInterval(() => { const el = $("#lookSec"); if (el) el.textContent = Math.round((Date.now()-t0)/1000) + "s"; }, 1000);
  const isAsin = /^B0[0-9A-Z]{8}$/.test(q) || (/^[0-9]{9}[0-9X]$/.test(q) && q.length===10);
  const params = new URLSearchParams({key:S.key, domain:"1", stats:"180", history:"1", rating:"0", _:String(Date.now())});
  if (S.buybox) params.set("buybox","1");
  if (isAsin) params.set("asin", q); else params.set("code", q);
  try{
    const r = await fetch("https://api.keepa.com/product?"+params, {signal:ctl.signal, cache:"no-store"});
    let j = null; try { j = await r.json(); } catch(e) {}
    if (j && j.tokensLeft!=null) S.tokens = j.tokensLeft;
    if (r.status===429 || (j && j.tokensLeft!=null && j.tokensLeft<0 && !(j.products||[]).length)){
      const wait = j && j.refillIn ? Math.ceil(j.refillIn/1000) : null;
      throw new Error("Out of Keepa tokens" + (wait ? `. Next refill in ${wait}s.` : ". Wait a minute and scan again.") + (S.buybox ? " Turning off buy box in Settings makes each scan cheaper." : ""));
    }
    if (!r.ok) throw new Error("Keepa returned an error (HTTP "+r.status+")" + (j && j.error ? ": "+(j.error.message||j.error.type) : "") + ".");
    if (!j) throw new Error("Keepa sent back an empty answer. Try again.");
    if (j.error) throw new Error(j.error.message || j.error.type || "Keepa error");
    const prods = (j.products||[]).filter(p => p && p.asin && p.title);
    if (!prods.length) throw new Error("No Amazon match for "+q+".");
    current = {product:prods[0], matches:prods.slice(1), cost:S.defCost, code:q};
    current.calc = calc(current.product, current.cost);
    S.history.unshift(histEntry(current));
    S.history = S.history.slice(0,300);
    save();
    if (navigator.vibrate) navigator.vibrate(current.calc.buy ? [60,40,60] : 120);
    offTab = null;
    busy = false; renderScan();
    if (S.autoOffers || cachedOffers(current.product.asin)) loadOffers(false);
    return {ok:true};
  }catch(e){
    if (ctl !== lookupCtl) return {ok:false, stale:true};   // a newer scan replaced this one
    busy = false;
    let msg = e && e.message;
    if (ctl.signal.aborted){
      const t = await keepaTokens();
      msg = "Keepa didn't answer within 20 seconds." + (t && t.tokensLeft!=null ? ` Tokens left: ${t.tokensLeft}` + (t.refillRate ? `, refilling ${t.refillRate}/min.` : ".") : "") + (t && t.tokensLeft<=0 ? " You're out of tokens, which is the usual cause." : " Scan again.");
    } else if (msg === "Failed to fetch" || msg === "Load failed"){
      msg = "Couldn't reach Keepa. Check your connection and scan again.";
    }
    renderScan(msg);
    save();
    return {ok:false, error:msg};
  }finally{
    clearTimeout(timer); clearInterval(secTimer);
    if (ctl === lookupCtl) lookupCtl = null;
  }
}
/* ============ live offers ============ */
const COND = {1:"New",2:"Like New",3:"Very Good",4:"Good",5:"Acceptable",6:"Refurb",7:"Collectible LN",8:"Collectible VG",9:"Collectible G",10:"Collectible A",11:"Collectible"};
let offTab = null;
function parseOffers(p){
  const live = new Set(p.liveOffersOrder || []);
  const out = [];
  (p.offers || []).forEach((o, i) => {
    if (live.size && !live.has(i)) return;
    const c = o.offerCSV || []; if (c.length < 3) return;
    const price = c[c.length-2], ship = c[c.length-1];
    if (price == null || price < 0) return;
    out.push({price:price/100, ship:Math.max(0,ship||0)/100, total:(price+Math.max(0,ship||0))/100,
      cond:o.condition, condLabel:COND[o.condition] || "Other", fba:!!o.isFBA, prime:!!o.isPrime, amazon:!!o.isAmazon,
      used:o.condition >= 2 && o.condition <= 5, isNew:o.condition === 1, comment:o.conditionComment || ""});
  });
  return out.sort((a,b) => a.total - b.total);
}
const OFFER_TTL = 2*3600e3;
function cachedOffers(asin){
  const c = LS.get("offers."+asin, null);
  return c && Date.now() - c.t < OFFER_TTL ? c : null;
}
async function loadOffers(force){
  if (!current || current.offersLoading) return;
  const asin = current.product.asin, mine = current;
  const hit = !force && cachedOffers(asin);
  if (hit){ mine.offers = hit.list; mine.offersAt = hit.t; mine.calc = calc(mine.product, mine.cost); renderScan(); return; }
  mine.offersLoading = true; mine.offersErr = null; renderScan();
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 20000);
  try{
    const params = new URLSearchParams({key:S.key, domain:"1", asin, offers:"40", "only-live-offers":"1", history:"0", stats:"0", _:String(Date.now())});
    const r = await fetch("https://api.keepa.com/product?"+params, {signal:ctl.signal, cache:"no-store"});
    let j = null; try { j = await r.json(); } catch(e){}
    if (j && j.tokensLeft != null) S.tokens = j.tokensLeft;
    if (r.status === 429) throw new Error("Not enough Keepa tokens for offers." + (j && j.refillIn ? ` Refill in ${Math.ceil(j.refillIn/1000)}s.` : ""));
    if (!r.ok || !j) throw new Error("Keepa offers request failed (HTTP "+r.status+").");
    if (j.error) throw new Error(j.error.message || j.error.type);
    const p = (j.products||[])[0];
    if (!p) throw new Error("No offer data for this item.");
    mine.offers = parseOffers(p); mine.offersAt = Date.now();
    LS.set("offers."+asin, {t:mine.offersAt, list:mine.offers});
  }catch(e){
    mine.offersErr = ctl.signal.aborted ? "Keepa didn't answer within 20 seconds." : e.message;
  }finally{
    clearTimeout(tm); mine.offersLoading = false; save();
    if (current === mine){ current.calc = calc(current.product, current.cost); renderScan(); }
  }
}

function rangeHTML(){

  if (vals.length < 3) return "";
  vals.sort((x,y) => x-y);

  const top = Math.max(mx, sell||0), span = (top - mn) || 1;

function pick(p){ current.product = p; current.matches = []; current.offers = null; current.offersErr = null; current.calc = calc(p, current.cost); renderScan(); }

/* ============ math ============ */
function readPrices(p){
  const c = (p.stats && p.stats.current) || [];
  const at = i => cents(c[i]);
  return {
    amazon: at(0), newLow: at(1), usedLow: at(2),
    newBB: p.stats && p.stats.buyBoxPrice > 0 ? (p.stats.buyBoxPrice + Math.max(0,p.stats.buyBoxShipping||0))/100 : at(18),
    usedBB: p.stats && p.stats.buyBoxUsedPrice > 0 ? (p.stats.buyBoxUsedPrice + Math.max(0,p.stats.buyBoxUsedShipping||0))/100 : at(32),
    newFBA: at(10), usedLN: at(19), usedVG: at(20), usedG: at(21), usedA: at(22),
    rank: c[3] != null && c[3] > 0 ? c[3] : null,
    avgRank: p.stats && p.stats.avg180 && p.stats.avg180[3] > 0 ? p.stats.avg180[3] : null,
    pulse: p.stats ? Math.max(0, p.stats.salesRankDrops180 ?? 0) : 0,
    countNew: c[11] > 0 ? c[11] : 0, countUsed: c[12] > 0 ? c[12] : 0,
    histUsed: p.stats && p.stats.avg180 ? cents(p.stats.avg180[2]) : null,
    histNew:  p.stats && p.stats.avg180 ? cents(p.stats.avg180[1]) : null,
    avgUsedBB: p.stats && p.stats.avg180 ? cents(p.stats.avg180[32]) : null,
    avgNewBB:  p.stats && p.stats.avg180 ? cents(p.stats.avg180[18]) : null
  };
}
function calc(p, cost){
  const pr = readPrices(p);
  const firstOf = list => { for (const [v, src] of list) if (v != null) return [v, src]; return [null, ""]; };
  let [sell, sellSrc] = S.cond === "used"
    ? firstOf([[pr.usedBB,"used buy box"],[pr.usedVG,"lowest VG"],[pr.usedG,"lowest G"],[pr.usedLow,"lowest used"]])
    : firstOf([[pr.newBB,"new buy box"],[pr.newFBA,"lowest new FBA"],[pr.newLow,"lowest new"],[pr.amazon,"Amazon"]]);
  const offs = current && current.product === p ? current.offers : null;
  let newFBA = pr.newFBA ?? pr.newBB;
  if (offs){
    const fba = offs.filter(x => x.fba && (S.cond === "used" ? x.used : x.isNew));
    if (fba.length){ sell = fba[0].total; sellSrc = "lowest FBA"; }
    const nf = offs.find(x => x.fba && x.isNew); if (nf) newFBA = nf.total;
  }
  // buyers won't pay more for used than for a new Prime copy
  if (S.cond === "used" && sell != null && newFBA != null && newFBA < sell){ sell = newFBA; sellSrc = "capped at new FBA"; }
  const isBook = p.rootCategory === 283155 || p.productGroup === "Book" || p.type === "BOOK";
  const refPct = (p.referralFeePercentage ?? p.referralFeePercent ?? 15) / 100;
  const fbaFee = p.fbaFees && p.fbaFees.pickAndPackFee > 0 ? p.fbaFees.pickAndPackFee/100 : 3.50;
  const lbs = p.packageWeight > 0 ? p.packageWeight/453.6 : 1;
  const closing = isBook ? 1.80 : 0;
  let fees = null, profit = null;
  if (sell){
    fees = sell*refPct + closing + fbaFee + lbs*S.inbound + S.prep;
    profit = sell - fees - (cost||0);
  }
  const res = {pr, sell, sellSrc, fees, profit, fbaFee, refPct, closing, lbs, isBook, buy:false, why:"", trigger:null};
  if (profit == null){ res.why = "No price"; return res; }
  if (p.isAdultProduct){ res.why = "Adult item"; return res; }
  res.roi = cost > 0 ? res.profit / cost * 100 : null;
  if (S.mode === "ev") return evDecide(res);
  if (S.mode === "roi") return roiDecide(res);
  return trigDecide(res);
}
function trigDecide(res){
  const rank = res.pr.rank ?? 0, pulse = res.pr.pulse;
  for (const t of S.triggers){
    if (!t.on) continue;
    // Ladder: a better rank or a faster pulse never disqualifies a book. If it misses a tier,
    // it drops to the next, slower tier, which asks for more profit. Exclude (red) triggers still use exact ranges.
    const ladder = S.ladder && t.color !== "red";
    const inRank = ladder ? (rank > 0 && rank <= t.rMax) : (rank >= t.rMin && rank <= t.rMax);
    const inPulse = ladder ? pulse >= t.pMin : (pulse >= t.pMin && pulse <= t.pMax);
    if (inRank && inPulse){
      res.trigger = t.name;
      if (t.color === "red"){ res.why = t.name; return res; }
      res.target = t.minProfit;
      if (res.profit >= t.minProfit){ res.buy = true; res.why = t.name; return res; }
    }
  }
  res.why = res.trigger ? "Under min profit" : "No trigger hit";
  return res;
}
function roiDecide(res){
  const r = S.roi, rank = res.pr.rank, pulse = res.pr.pulse;
  res.target = r.minProfit; res.trigger = "ROI rule";
  if (!rank || rank > r.maxRank){ res.why = rank ? "Rank over " + kfmt(r.maxRank) : "No sales rank"; return res; }
  if (pulse < r.minPulse){ res.why = `Only ${pulse} sales in 6m (need ${r.minPulse})`; return res; }
  if (res.profit < r.minProfit){ res.why = "Under $" + r.minProfit + " profit"; return res; }
  if (res.roi != null && res.roi < r.minRoi){ res.why = `ROI ${Math.round(res.roi)}% (need ${r.minRoi}%)`; return res; }
  res.buy = true;
  res.why = "ROI rule · " + (res.roi == null ? "free item" : Math.round(res.roi) + "% ROI");
  return res;
}
function bucket(pr){
  if (!pr.rank) return "norank";
  const yr = pr.pulse * 2;  // 180-day drops, annualized
  if (yr >= 137) return "daily";
  if (yr >= 35) return "weekly";
  if (yr >= 10) return "monthly";
  if (yr >= 3) return "quarter";
  if (yr >= 1) return "few";
  return "none";
}
function evDecide(res){
  const b = bucket(res.pr);
  const row = S.ev.find(r => r.key === b) || DEFAULT_EV.find(r => r.key === b);
  res.trigger = row.label;
  if (row.keep == null){ res.why = "Pass: " + row.label.toLowerCase(); return res; }
  const expected = res.profit * row.pct/100;
  res.expected = expected; res.target = row.keep;
  res.buy = expected >= row.keep;
  res.why = (res.buy ? "" : "Low: ") + "EV " + money(expected);
  return res;
}
function histEntry(cur){
  const p = cur.product, c = cur.calc;
  return {t:Date.now(), asin:p.asin, title:p.title, img:imgUrl(p), buy:c.buy, profit:c.profit, rank:c.pr.rank, pulse:c.pr.pulse, why:c.why};
}
function imgUrl(p){
  let n = null;
  if (Array.isArray(p.images) && p.images.length) n = typeof p.images[0] === "string" ? p.images[0] : (p.images[0].m || p.images[0].l);
  else if (p.imagesCSV) n = p.imagesCSV.split(",")[0];
  return n ? "https://m.media-amazon.com/images/I/" + n : "";
}

// Free on-phone text reading (Tesseract). ISBN found -> normal lookup. Otherwise read the big cover text,
// let the user fix it, then run a Keepa title search (~10 tokens) and pick the match.
let visual = null;   // {stage, pct, img, term, results, err, note}
let ocrWorker = null;
const isCode = v => { const c = String(v||"").replace(/[\s-]/g,"").toUpperCase();
  return /^[0-9]{8,14}$/.test(c) || /^[0-9]{9}[0-9X]$/.test(c) || /^B0[0-9A-Z]{8}$/.test(c); };
function validIsbn(d){
  if (d.length === 13 && /^97[89][0-9]{10}$/.test(d)){ let s=0; for (let i=0;i<12;i++) s += (+d[i])*(i%2?3:1); return (10 - s%10)%10 === +d[12]; }

function findIsbn(text){

  // (no lookbehind regex: older iPhones can't parse it)

  const runs = t.match(/[0-9X][0-9X\s-]{8,20}[0-9X]/g) || [];
  for (const r of runs){
    const d = r.replace(/[\s-]/g,"");
    for (const len of [13,10]) for (let i=0; i+len<=d.length; i++){ const w = d.slice(i,i+len); if (validIsbn(w)) return w; }
  }
  return null;
}
function guessTitle(data){
  const lines = (data.lines || []).map(l => ({text:l.text.trim(), h:l.bbox.y1-l.bbox.y0, y:l.bbox.y0, conf:l.confidence}))
    .filter(l => { const letters = (l.text.match(/[A-Za-z]/g)||[]).length; return letters >= 3 && letters/l.text.length > .6 && l.conf > 45; });
  if (!lines.length) return (data.text||"").replace(/[^A-Za-z0-9' ]+/g," ").replace(/\s+/g," ").trim().slice(0,70);
  const maxH = Math.max(...lines.map(l => l.h));
  const big = [...lines].filter(l => l.h >= maxH*.45).sort((a,b) => b.h-a.h).slice(0,4).sort((a,b) => a.y-b.y);   // biggest text, read top to bottom
  return big.map(l => l.text).join(" ").replace(/[^A-Za-z0-9'&: ]+/g," ").replace(/\s+/g," ").trim().slice(0,80);

async function getOcr(onPct){

async function prepImage(file){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*s); cv.height = Math.round(bmp.height*s);
  const g = cv.getContext("2d", {willReadFrequently:true}); g.drawImage(bmp,0,0,cv.width,cv.height);

  const im = g.getImageData(0,0,cv.width,cv.height), d = im.data; let mn=255, mx=0;

}
async function visualScan(e){

  try{
    const cv = await prepImage(file);
    const w = await getOcr(p => { if (visual){ visual.pct = p; const b = $("#visPct"); if (b) b.style.width = p+"%"; } });
    if (!visual) return;
    const {data} = await w.recognize(cv, {rotateAuto:true});

  }

}
async function titleSearch(term){
  term = String(term||"").trim();
  if (term.length < 3){ renderScan("Type at least a few words of the title."); return; }
  if (!S.key){ renderScan("Add your Keepa API key in Settings first."); return; }
  visual = {...(visual||{}), stage:"searching", term};
  renderScan();
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 20000);
  try{
    const params = new URLSearchParams({key:S.key, domain:"1", type:"product", term, page:"0", _:String(Date.now())});
    const r = await fetch("https://api.keepa.com/search?"+params, {signal:ctl.signal, cache:"no-store"});
    let j = null; try { j = await r.json(); } catch(e){}
    if (j && j.tokensLeft != null){ S.tokens = j.tokensLeft; save(); }
    if (r.status === 429) throw new Error("Not enough Keepa tokens for a title search (about 10)." + (j && j.refillIn ? ` Refill in ${Math.ceil(j.refillIn/1000)}s.` : ""));
    if (!r.ok || !j) throw new Error("Keepa search failed (HTTP "+r.status+").");
    if (j.error) throw new Error(j.error.message || j.error.type);
    const prods = (j.products || []).filter(p => p && p.asin && p.title).slice(0,10);
    const list = prods.length ? prods : (j.asinList || []).slice(0,10).map(a => ({asin:a, title:a}));
    visual = {...visual, stage:"results", results:list, err: list.length ? null : `No Amazon matches for "${term}". Try fewer words, like just the main title and author's last name.`};
  }catch(err){
    visual = {...visual, stage:"results", results:[], err: ctl.signal.aborted ? "Keepa didn't answer within 20 seconds." : err.message};
  }finally{ clearTimeout(tm); }
  renderScan();
}

/* ============ camera ============ */
// Own decode loop: high-res stream, crop the center band to a canvas, decode with ZXing.
// Uses the native BarcodeDetector when the browser has one (faster), ZXing otherwise.
const FORMATS = () => [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128];
let stream = null, camTimer = null, zx = null, native = null;
function makeZx(){
  const r = new ZXing.MultiFormatReader();
  const h = new Map();
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, FORMATS());
  h.set(ZXing.DecodeHintType.TRY_HARDER, true);
  r.setHints(h);
  return r;
}
function decodeCanvas(cv){
  if (!zx) zx = makeZx();
  const src = new ZXing.HTMLCanvasElementLuminanceSource(cv);
  for (const bmp of [new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src)), new ZXing.BinaryBitmap(new ZXing.GlobalHistogramBinarizer(src))]){
    try { return zx.decodeWithState(bmp).getText(); } catch(e) { zx.reset(); }
  }
  return null;
}
function freshVideo(){
  // iPhone Safari often freezes a <video> that is reused after its stream is detached, so swap in a new one each time
  const old = $("#video"), v = document.createElement("video");
  v.id = "video"; v.autoplay = true; v.muted = true; v.playsInline = true;
  v.setAttribute("autoplay",""); v.setAttribute("muted",""); v.setAttribute("playsinline","");
  old.replaceWith(v);
  return v;
}
const streamLive = () => stream && stream.getVideoTracks().some(t => t.readyState === "live");
async function openCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("Live camera needs https. Use the photo option."); return; }
  if (!window.ZXing && !("BarcodeDetector" in window)){ toast("Scanner library didn't load. Reload the page."); return; }
  if (native === null && "BarcodeDetector" in window){
    try { native = new BarcodeDetector({formats:["ean_13","upc_a","ean_8","upc_e","code_128"]}); } catch(e){ native = false; }
  }
  clearTimeout(camTimer); camTimer = null;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch(e){}
  setContBtn(); $("#camRes").hidden = true; lastCode = null;
  $("#cam").hidden = false;
  $("#camHint").textContent = "Point at the barcode";
  // keep the camera stream between scans: faster, no re-prompt, avoids the iOS second-open freeze
  if (!streamLive()){
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}});
    }catch(e){ stopStream(); $("#cam").hidden = true; toast("Camera blocked. Settings > Safari > Camera > Allow."); return; }
    try { const tr = stream.getVideoTracks()[0]; const caps = tr.getCapabilities ? tr.getCapabilities() : {};
          if (caps.focusMode && caps.focusMode.includes("continuous")) await tr.applyConstraints({advanced:[{focusMode:"continuous"}]}); } catch(e){}
  }
  const video = freshVideo();
  video.srcObject = stream;
  try { await video.play(); } catch(e){}
  const session = ++camSession;
  const cv = document.createElement("canvas"), g = cv.getContext("2d", {willReadFrequently:true});
  let n = 0;
  const tick = async () => {
    if (session !== camSession || $("#cam").hidden || !streamLive()) return;
    if (video.readyState >= 2 && video.videoWidth){
      const vw = video.videoWidth, vh = video.videoHeight;
      // center band: 80% wide, 35% tall (barcodes are wide)
      const cw = Math.round(vw*0.8), ch = Math.round(vh*0.35), cx = Math.round((vw-cw)/2), cy = Math.round((vh-ch)/2);
      const scale = Math.min(1, 1280/cw);
      cv.width = Math.round(cw*scale); cv.height = Math.round(ch*scale);
      g.drawImage(video, cx, cy, cw, ch, 0, 0, cv.width, cv.height);
      let code = null;
      try{
        if (native){ const r = await native.detect(cv); if (r && r.length) code = r[0].rawValue; }
        else if (window.ZXing) code = decodeCanvas(cv);
      }catch(e){ zx = null; }   // rebuild the decoder if it ever gets into a bad state
      if (session !== camSession) return;
      if (code){
        if (!S.cont){ closeCam(); if (navigator.vibrate) navigator.vibrate(40); lookup(code); return; }
        if (!(code === lastCode && Date.now() - lastAt < 5000)){   // ignore the same barcode for 5s
          lastCode = code; lastAt = Date.now();
          await contLookup(code);
          if (session !== camSession) return;
        }
      }
      if (++n === 40) $("#camHint").textContent = "Hold steady, fill the box with the barcode, avoid glare";
    } else if (video.paused) { try { await video.play(); } catch(e){} }

  };
  tick();
}
let camSession = 0, lastCode = null, lastAt = 0, audio = null;
function beep(kind){
  try{
    if (!audio) return;
    const tones = kind === "buy" ? [880, 1320] : kind === "skip" ? [300] : [600];
    tones.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i*0.13;
      o.frequency.value = f; o.type = "square"; g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+0.11);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t+0.12);
    });
  }catch(e){}
}

  showCamRes(c.buy ? "buy" : "skip", `<span class="w">${c.buy ? "BUY" : "SKIP"}</span><span class="t">${esc(p.title)}</span><span class="p num">${money(c.profit)}</span>
    <span class="s">${esc(c.why)} · rank ${kfmt(c.pr.rank)} · pulse ${c.pr.pulse} · tap for details</span>`);
}

  clearTimeout(camTimer); camTimer = null;
  const v = $("#video"); try { v.pause(); } catch(e){}
  $("#cam").hidden = true;
}
function stopStream(){
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = $("#video"); if (v) v.srcObject = null;
}
// release the camera when the app goes to the background
document.addEventListener("visibilitychange", () => { if (document.hidden){ closeCam(); stopStream(); } });
$("#camClose").onclick = closeCam;
async function photoScan(e){
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try{
    const bmp = await createImageBitmap(file);
    const cv = document.createElement("canvas"), g = cv.getContext("2d", {willReadFrequently:true});
    let code = null;
    // try a few sizes and both orientations; phone photos are huge and often sideways
    for (const max of [1600, 1000, 2400]){
      for (const rot of [0, 90]){
        const s = Math.min(1, max/Math.max(bmp.width,bmp.height));
        const w = Math.round(bmp.width*s), h = Math.round(bmp.height*s);
        if (rot){ cv.width = h; cv.height = w; g.save(); g.translate(h,0); g.rotate(Math.PI/2); g.drawImage(bmp,0,0,w,h); g.restore(); }
        else { cv.width = w; cv.height = h; g.drawImage(bmp,0,0,w,h); }
        if ("BarcodeDetector" in window){ try{ const r = await new BarcodeDetector().detect(cv); if (r.length) code = r[0].rawValue; }catch(err){} }
        if (!code && window.ZXing) code = decodeCanvas(cv);
        if (code) break;
      }
      if (code) break;
    }
    if (code) lookup(code);
    else renderScan("Couldn't read a barcode in that photo. Fill the frame with it and keep it sharp, or type the number.");
  }catch(err){ renderScan("Couldn't open that photo. Try again or type the number."); }
}

/* ============ chart ============ */
const SERIES = [
  {key:"used",   label:"Used",    idx:2,  stride:2, color:"#e9edf1", on:true},
  {key:"usedbb", label:"Used BB", idx:32, stride:3, color:"#2dd4bf", on:true},
  {key:"new",    label:"New",     idx:1,  stride:2, color:"#38bdf8", on:false},
  {key:"newbb",  label:"New BB",  idx:18, stride:3, color:"#ec4899", on:true},
  {key:"amazon", label:"Amazon",  idx:0,  stride:2, color:"#f5a623", on:false},
  {key:"rank",   label:"Rank",    idx:3,  stride:2, color:"#22c55e", on:true, rank:true}
];
let chartState = null;
function parseSeries(p, s){
  const a = p.csv && p.csv[s.idx]; if (!a) return [];
  const out = [];
  for (let i=0; i+1<a.length; i+=s.stride){
    let v = a[i+1];
    if (s.stride===3 && v>=0 && a[i+2]>0) v += a[i+2];
    out.push([keepaToMs(a[i]), v<0 ? null : (s.rank ? v : v/100)]);
  }
  return out;
}
function openChart(p){
  chartState = {p, days:90, data:SERIES.map(s => ({...s, pts:parseSeries(p,s)})), hover:null};
  const sh = $("#sheet"); sh.hidden = false;
  sh.innerHTML = `<div class="sheet-head"><div class="t">${esc(p.title)}</div><button class="round" style="background:var(--panel2)" id="shClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="note" style="margin-top:6px">Tap or drag to inspect a date</div>
  <div class="pillrow" id="ranges">${[30,90,180,365,0].map(d=>`<button class="pill" data-d="${d}" aria-pressed="${d===90}">${d?d+"d":"All"}</button>`).join("")}
    <a class="pill" style="color:var(--fg);text-decoration:none" target="_blank" rel="noopener" href="https://keepa.com/#!product/1-${p.asin}">Keepa ↗</a></div>
  <div class="pillrow" id="sers">${chartState.data.map((s,i)=>`<button class="ser" style="--c:${s.color}" data-i="${i}" aria-pressed="${s.on}">${s.label}</button>`).join("")}</div>
  <div class="chartbox"><canvas id="cv"></canvas></div>
  <div class="readout" id="readout">Tap or drag on the chart to inspect a date.</div>`;
  $("#shClose").onclick = () => { sh.hidden = true; chartState = null; };
  $("#ranges").addEventListener("click", e => { const b=e.target.closest("[data-d]"); if(!b) return; chartState.days=+b.dataset.d; document.querySelectorAll("#ranges [data-d]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); drawChart(); });
  $("#sers").addEventListener("click", e => { const b=e.target.closest("[data-i]"); if(!b) return; const s=chartState.data[+b.dataset.i]; s.on=!s.on; b.setAttribute("aria-pressed",String(s.on)); drawChart(); });
  const cv = $("#cv");
  const inspect = ev => { const r=cv.getBoundingClientRect(); const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left; chartState.hover=x; drawChart(); };
  cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); inspect(e); });
  cv.addEventListener("pointermove", e => { if (e.buttons || e.pointerType==="touch") inspect(e); });
  cv.addEventListener("dblclick", () => { chartState.hover=null; drawChart(); $("#readout").textContent="Tap or drag on the chart to inspect a date."; });
  drawChart();
}
function valueAt(pts, t){ let v=null; for (const [x,y] of pts){ if (x>t) break; v=y; } return v; }
function drawChart(){
  const st = chartState, cv = $("#cv"); if (!st || !cv) return;
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext("2d"); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const L=50, R=52, T=12, B=26, pw=W-L-R, ph=H-T-B;
  const now = Date.now();
  let t0 = st.days ? now - st.days*864e5 : Math.min(...st.data.flatMap(s=>s.pts.length?[s.pts[0][0]]:[now-365*864e5]));
  const vis = st.data.filter(s=>s.on);
  const clip = s => { const pre = valueAt(s.pts,t0); const pts = s.pts.filter(([x])=>x>=t0); if (pre!=null) pts.unshift([t0,pre]); if (pts.length) pts.push([now, pts[pts.length-1][1]]); return pts; };
  const series = vis.map(s => ({...s, cp:clip(s)}));
  const prices = series.filter(s=>!s.rank).flatMap(s=>s.cp.map(p=>p[1])).filter(v=>v!=null);
  const ranks  = series.filter(s=>s.rank).flatMap(s=>s.cp.map(p=>p[1])).filter(v=>v!=null);
  const pMax = prices.length ? Math.max(...prices)*1.08 : 1, pMin = 0;
  const rMin = ranks.length ? Math.min(...ranks)*0.92 : 0, rMax = ranks.length ? Math.max(...ranks)*1.05 : 1;
  const X = t => L + (t-t0)/(now-t0)*pw;
  const YP = v => T + ph - (v-pMin)/(pMax-pMin||1)*ph;
  const YR = v => T + ph - (v-rMin)/(rMax-rMin||1)*ph;   // higher on chart = worse rank, like Keepa's scale here
  g.font = "12px JetBrains Mono, monospace"; g.textBaseline="middle";
  g.strokeStyle = "#2f3740"; g.lineWidth = 1;
  for (let i=0;i<=2;i++){
    const y = T + ph*i/2; g.beginPath(); g.moveTo(L,y); g.lineTo(L+pw,y); g.stroke();
    g.fillStyle="#8d98a4"; g.textAlign="right"; g.fillText(money(pMax-(pMax-pMin)*i/2), L-6, y);
    if (ranks.length){ g.fillStyle="#22c55e"; g.textAlign="left"; g.fillText(kfmt(Math.round(rMax-(rMax-rMin)*i/2)), L+pw+6, y); }
  }
  // month ticks
  g.fillStyle="#8d98a4"; g.textAlign="center"; g.textBaseline="top";
  const d = new Date(t0); d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth()+1);
  const step = (now-t0) > 400*864e5 ? 3 : 1;
  for (; d.getTime()<now; d.setMonth(d.getMonth()+step)){
    const x = X(d.getTime()); g.strokeStyle="#2f3740"; g.beginPath(); g.moveTo(x,T); g.lineTo(x,T+ph); g.stroke();
    g.fillText(d.toLocaleString("en-US",{month:"short"}) + (step>1?" '"+String(d.getFullYear()).slice(2):""), x, T+ph+6);
  }
  // lines (step style, like Keepa)
  for (const s of series){
    g.strokeStyle = s.color; g.lineWidth = 2; g.setLineDash(s.rank ? [6,5] : []);
    const Y = s.rank ? YR : YP; g.beginPath(); let pen=false, lastY=null;
    for (const [t,v] of s.cp){
      if (v==null){ pen=false; continue; }
      const x=X(t), y=Y(v);
      if (!pen){ g.moveTo(x,y); pen=true; } else { g.lineTo(x,lastY); g.lineTo(x,y); }
      lastY=y;
    }
    g.stroke();
  }
  g.setLineDash([]);
  if (!series.some(s=>s.cp.some(p=>p[1]!=null))){ g.fillStyle="#8d98a4"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("No history for these series", L+pw/2, T+ph/2); }
  // inspector
  if (st.hover!=null){
    const x = Math.max(L, Math.min(L+pw, st.hover)); const t = t0 + (x-L)/pw*(now-t0);
    g.strokeStyle="#f5a623"; g.beginPath(); g.moveTo(x,T); g.lineTo(x,T+ph); g.stroke();
    const parts = series.map(s => { const v=valueAt(s.cp,t); return `<span style="color:${s.color}">${s.label} ${s.rank ? kfmt(v) : money(v)}</span>`; });
    $("#readout").innerHTML = `<b style="color:var(--fg)">${new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</b> · ` + parts.join(" · ");
  }
}
window.addEventListener("resize", () => chartState && drawChart());

  const h = S.history;
  $("#main").innerHTML = `<div class="row"><h2 class="grow">Scan history</h2>${h.length?'<button class="mini" id="clrH">Clear</button>':""}</div>` +
    (h.length ? h.map((x,i)=>`<div class="card"><div class="row">
      ${x.img?`<img src="${x.img}" alt="" style="width:40px;height:52px;object-fit:contain;background:#fff;border-radius:5px">`:""}
      <div class="grow"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.title)}</div>
      <div class="note num">${x.asin} · rank ${kfmt(x.rank)} · pulse ${x.pulse} · ${new Date(x.t).toLocaleDateString()}</div></div>
      <div style="text-align:right"><span class="tag ${x.buy?"buy":"skip"}">${x.buy?"BUY":"SKIP"}</span><div class="num" style="margin-top:4px">${money(x.profit)}</div></div>

  document.querySelectorAll("[data-re]").forEach(b => b.onclick = () => { const a=S.history[+b.dataset.re].asin; setTab("scan"); lookup(a); });
}
function renderInventory(){
