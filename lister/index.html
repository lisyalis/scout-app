<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lister">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111418">
<title>Bethany Lister</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  --bg:#111418; --panel:#1b2026; --panel2:#232a31; --line:#2f3740;
  --fg:#e9edf1; --muted:#8d98a4; --accent:#f5a623; --accent-ink:#1a1204;
  --buy:#22c55e; --skip:#e5534b; --warn:#eab308; --blue:#38bdf8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;padding:12px max(14px,env(safe-area-inset-left,0px)) 24px max(14px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:700 18px/1 var(--display);letter-spacing:.03em;margin:0;text-transform:uppercase;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
h2{font:700 20px/1.1 var(--display);letter-spacing:.03em;margin:14px 0 8px;text-transform:uppercase}
.note{color:var(--muted);font-size:13px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.top{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.top a{margin-left:auto;padding:6px 10px;flex:none}
.top .seg{flex:none}
.top .seg button{padding:5px 10px}
.seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;font:700 15px var(--display);letter-spacing:.06em;color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.wide{display:grid;grid-template-columns:repeat(5,1fr);width:100%}
.seg.wide button{padding:8px 2px;font-size:14px}
.seg.wide button+button{border-left:1px solid var(--accent)}
.scanrow{display:flex;gap:8px}
.scanrow input{flex:1}
.btn{padding:12px;border-radius:10px;font-weight:700;background:var(--panel2);border:1px solid var(--line);text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.go{background:var(--buy);color:#05230f;border-color:var(--buy);font:700 22px var(--display);letter-spacing:.06em;width:100%;margin-top:14px;padding:14px}
.btn:disabled{opacity:.45}
.mini{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none;background:var(--panel)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;min-height:0;object-fit:cover;display:block}
.cam .reticle{position:absolute;left:8%;right:8%;top:38%;height:22%;border:3px dashed var(--buy);border-radius:12px;pointer-events:none}
.cam .bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.cam .bar .btn{min-width:110px}
.cam .hint{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-weight:700;text-shadow:0 1px 3px #000}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.prod{display:flex;gap:12px;align-items:flex-start}
.prod img{width:70px;height:90px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.prod .t{font-weight:600;font-size:17px;line-height:1.25}
.prod .meta{color:var(--muted);font-size:13px;margin-top:3px}
.asin{color:var(--accent);font-weight:700;margin-top:4px}
.matches{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.matches button{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:var(--panel2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate{margin-top:10px;border-radius:10px;padding:10px 12px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate.ok{background:rgba(34,197,94,.14);color:var(--buy)}
.gate.bad{background:rgba(229,83,75,.16);color:var(--skip)}
.gate.wait{background:var(--panel2);color:var(--muted)}
.gate .msg{font-weight:500;font-size:13px;color:var(--fg);flex-basis:100%}
.offers{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.offers button{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;background:var(--panel2);padding:9px 12px;text-align:left}
.offers button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.tag{font:700 12px var(--display);letter-spacing:.08em;border-radius:6px;padding:2px 6px;text-align:center}
.tag.fba{background:rgba(56,189,248,.18);color:var(--blue)}
.tag.mf{background:rgba(141,152,164,.18);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-top:10px}
.grid2 .field,.grid3 .field{margin-top:0}
.money{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;background:var(--panel)}
.money>div{padding:9px 4px;text-align:center}
.money>div+div{border-left:1px solid var(--line)}
.money .v{font:700 22px/1.15 var(--display)}
.pos{color:var(--buy)} .neg{color:var(--skip)}
.result{margin-top:12px;border-radius:10px;padding:12px;font-weight:600}
.result.ok{background:rgba(34,197,94,.14);color:var(--buy)}
.result.bad{background:rgba(229,83,75,.16);color:var(--skip)}
.result ul{margin:6px 0 0;padding-left:18px;color:var(--fg);font-weight:500;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.list .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.list .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .item .m{font-size:13px;color:var(--muted);margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:60;max-width:90%;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#labelSheet{display:none}
.stats6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 8px 10px;text-align:center;border-bottom:3px solid var(--bar)}
.stat .k{font-size:12px;color:var(--fg);font-weight:600;white-space:nowrap}
.stat .v{font:700 17px/1.2 var(--mono);margin-top:4px}
@media (min-width:700px){.stats6{grid-template-columns:repeat(6,1fr)}}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.notes button{text-align:left;font-size:13px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2)}
.notes button[aria-pressed="true"],.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(245,166,35,.1)}
.sres{display:flex;gap:10px;align-items:center;width:100%;margin-top:8px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.sres img,.sres .noimg{width:44px;height:58px;object-fit:contain;background:#fff;border-radius:6px;flex:none}
.sres .t{display:block;font-weight:600;font-size:14px;line-height:1.25}
.sres .m{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kchart{width:100%;border-radius:10px;background:#fff;display:block;min-height:120px}
.lblprev{background:#fff;color:#000;border-radius:6px;margin:10px auto 0;box-shadow:0 2px 10px rgba(0,0,0,.5);overflow:hidden}
.lbl{box-sizing:border-box;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.lbl svg{display:block;width:100%;height:100%}
.lbl .fn{font-weight:700;letter-spacing:.06em;line-height:1}
.lbl .tt{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.1}
.lbl .cd{font-weight:700;line-height:1.1}
@media print{
  body *{visibility:hidden!important}
  #labelSheet,#labelSheet *{visibility:visible!important}
  #labelSheet{display:block!important;position:absolute;left:0;top:0}
  #labelSheet .lbl{page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div class="app">
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-tab="list" aria-current="true"><svg viewBox="0 0 24 24"><path d="M4 7V5h3M17 5h3v2M20 17v2h-3M7 19H4v-2M7 9v6M10 9v6M13 9v6M16 9v6"/></svg>List</button>
  <button data-tab="listed"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Listed</button>
  <button data-tab="ship"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Ship</button>
  <button data-tab="sales"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>Sales</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>Settings</button>
</nav>
</div>
<div class="cam" id="cam" hidden>
  <video id="video" autoplay muted playsinline></video>
  <div class="reticle"></div>
  <div class="hint">Fit the barcode in the green box</div>
  <div class="bar"><button class="btn" id="torchBtn" hidden>Light</button><button class="btn pri" id="camClose">Close</button></div>
</div>
<script>
// ---------- storage ----------
const LS = {
  get(k, d){ try { const v = localStorage.getItem("bl_" + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("bl_" + k, JSON.stringify(v)); } catch(e){} }
};
const CONDS = [
  {id:"new",        short:"NEW", name:"New",        offer:"New"},
  {id:"like_new",   short:"LN",  name:"Like New",   offer:"Used"},
  {id:"very_good",  short:"VG",  name:"Very Good",  offer:"Used"},
  {id:"good",       short:"G",   name:"Good",       offer:"Used"},
  {id:"acceptable", short:"AC",  name:"Acceptable", offer:"Used"},
];
const DEF_NOTES = {
  new: "Brand new, unread copy.",
  like_new: "Like new. Clean pages, tight binding, no markings.",
  very_good: "Very good. Light shelf wear on cover. Pages clean, no markings.",
  good: "Good. Visible wear on cover and edges. Pages intact and readable.",
  acceptable: "Acceptable. Heavy wear, may have markings or highlighting. All pages present."
};
// Add-on details for condition notes (tap to add/remove)
const DEF_CHIPS = ["Ex-library with usual stamps and stickers.", "Some highlighting or underlining.", "Name written inside cover.", "Dust jacket not included.", "Remainder mark on page edge.", "Access code or CD not included.", "Cover has a crease.", "Light water stain, text not affected.", "Fulfilled by Amazon: fast shipping."];
const S = {
  worker: LS.get("worker", "https://bethanylister.wickedgoodproducts.workers.dev"),
  key: LS.get("key", ""),
  channel: LS.get("channel", "fba"),
  cond: LS.get("cond", "very_good"),
  skuFba: LS.get("skuFba", "{DATE}-{COND}-{COST}-{RAND}"),
  skuMf: LS.get("skuMf", "MF{TICKET}-{COND}-{COST}"),
  ticket: LS.get("ticket", 1),
  shelf: LS.get("shelf", "A1"),
  notes: LS.get("notes", DEF_NOTES),
  listed: LS.get("listed", []),
  labelSize: LS.get("labelSize", "30334"),
  batchMode: LS.get("batchMode", false),
  batch: LS.get("batch", []),
  shipFrom: LS.get("shipFrom", {name:"", address1:"", address2:"", city:"", state:"", zip:"", phone:""}),
  box: LS.get("box", {l:12, w:10, h:8, lb:5}),
  boxPage: LS.get("boxPage", "PackageLabel_Letter_2"),
  ship: LS.get("ship", null),
  orders: LS.get("orders", {}),
  salesDays: LS.get("salesDays", 30),
  statsScope: LS.get("statsScope", "today"),
  chartAuto: LS.get("chartAuto", false),
  chartRange: LS.get("chartRange", 180),
  noteChips: LS.get("noteChips", DEF_CHIPS),
  source: LS.get("source", ""),
  sources: LS.get("sources", []),
};
function save(){ for (const k of ["worker","key","channel","cond","skuFba","skuMf","ticket","shelf","notes","listed","labelSize","batchMode","batch","shipFrom","box","boxPage","ship","orders","salesDays","statsScope","chartAuto","chartRange","noteChips","source","sources"]) LS.set(k, S[k]); }
function rememberSource(src){ if (!src) return; S.sources = [src].concat(S.sources.filter(x => x.toLowerCase() !== src.toLowerCase())).slice(0, 12); save(); }
// Keepa key is shared with Scout (same site, stored by Scout as scout.key)
const keepaKey = () => { try { return JSON.parse(localStorage.getItem("scout.key")) || ""; } catch(e){ return ""; } };
const live = () => S.listed.filter(x => !x.deleted);

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => v == null || isNaN(v) ? "—" : (v < 0 ? "−$" : "$") + Math.abs(v).toFixed(2);
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
const condOf = id => CONDS.find(c => c.id === id) || CONDS[2];

async function api(path, opts = {}){
  if (!S.worker || !S.key) throw new Error("Add your Worker URL and app key in Settings.");
  let r;
  try {
    r = await fetch(S.worker.replace(/\/+$/, "") + path, {...opts, headers: {"x-app-key": S.key, "content-type": "application/json"}});
  } catch(e){ throw new Error("Can't reach the Worker. Check your connection and the Worker URL."); }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error("Wrong app key. It must match APP_KEY in Cloudflare.");
  if (!r.ok){
    const m = d.error || (d.errors && d.errors[0] && (d.errors[0].message + (d.errors[0].details ? " " + d.errors[0].details : ""))) || ("Error " + r.status);
    const err = new Error(m); err.status = r.status; throw err;
  }
  return d;
}

// ---------- state for the item being listed ----------
let tab = "list";
let item = null;   // {code, asin, title, img, matches:[], cost, price, gate, gateMsg, gateLink, offers:{New,Used}, fees, result}
let feeTimer = null;

function blankItem(code){
  return {code, asin:null, title:"", img:"", matches:[], cost:"", price:"", note:notesFor(S.cond)[0] || "", qty:1, source:S.source,
    loading:true, err:null, gate:null, gateMsg:"", gateLink:"", offers:{}, offersErr:null, fees:null, feesErr:null,
    sku:"", result:null, busy:false};
}

// ---------- lookup ----------
function mapCatalog(x){
  const sum = (x.summaries && x.summaries[0]) || {};
  const by = (sum.contributors || []).filter(c => /author/i.test(c.role && (c.role.value || c.role) || "")).map(c => c.value).join(", ");
  return {
    asin: x.asin,
    title: sum.itemName || x.asin,
    by: by || sum.brand || "",
    year: sum.releaseDate ? String(sum.releaseDate).slice(0, 4) : "",
    format: sum.websiteDisplayGroupName || "",
    img: (x.images && x.images[0] && x.images[0].images && x.images[0].images[0] && x.images[0].images[0].link) || "",
    productType: (x.productTypes && x.productTypes[0] && x.productTypes[0].productType) || null,
    rank: (() => { const r = (x.salesRanks || [])[0] || {}; const d = (r.displayGroupRanks || [])[0] || (r.classificationRanks || [])[0]; return d ? d.rank : null; })(),
    // package weight from Amazon's catalog: some listings need it ("Package Weight Unit is required")
    pkgWeight: (() => { const d = (x.dimensions || [])[0] || {}; const w = (d.package && d.package.weight) || (d.item && d.item.weight); return w && w.value > 0 ? {value: +Number(w.value).toFixed(2), unit: String(w.unit || "pounds").toLowerCase()} : null; })()
  };
}
// Typed words (not an ISBN/UPC/ASIN) = title search: show the matches to pick from
const isCode = v => /^[0-9Xx\-\s]{8,17}$/.test(v) || /^B0[0-9A-Z]{8}$/i.test(v.trim());
let search = null;   // {q, loading, err, results}
async function titleSearch(q){
  closeCam(); item = null;
  search = {q, loading: true, results: []}; render();
  try {
    const d = await api("/lookup?q=" + encodeURIComponent(q));
    search.results = (d.items || []).map(mapCatalog);
    if (!search.results.length) search.err = "Nothing on Amazon matches \"" + q + "\".";
  } catch(e){ search.err = e.message; }
  search.loading = false; render();
}
function pickResult(i){
  const r = search && search.results[i]; if (!r) return;
  search = null;
  item = blankItem(r.asin);
  Object.assign(item, r, {matches: [], loading: false});
  item.sku = buildSku();
  render(); loadGate(); loadOffers();
}
function searchHTML(){
  if (!search) return "";
  if (search.loading) return `<div class="card"><span class="spin"></span> Searching Amazon for "${esc(search.q)}"…</div>`;
  if (search.err) return `<div class="result bad">${esc(search.err)}</div>`;
  return `<div class="card"><b>${search.results.length} results for "${esc(search.q)}"</b> <span class="note">· tap the right one</span>
    ${search.results.map((r, i) => `<button class="sres" data-res="${i}">
      ${r.img ? `<img src="${esc(r.img)}" alt="">` : `<span class="noimg"></span>`}
      <span style="min-width:0;text-align:left"><span class="t">${esc(r.title)}</span>
        <span class="m">${esc([r.by, r.format, r.year].filter(Boolean).join(" · "))}</span>
        <span class="m num">${esc(r.asin)}${r.rank ? ` · rank ${kfmt(r.rank)}` : ""}</span></span></button>`).join("")}</div>`;
}
async function lookup(raw){
  raw = String(raw || "").trim();
  if (!raw) return;
  if (!isCode(raw)){ titleSearch(raw); return; }
  search = null;
  const code = raw.toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (!code) return;
  closeCam();
  const keep = item && item.code === code ? item : null;
  item = blankItem(code);
  if (keep){ item.cost = keep.cost; item.price = keep.price; }
  const qs = new URLSearchParams(location.search);
  if (qs.get("code") === raw){ item.cost = qs.get("cost") || ""; item.price = qs.get("price") || ""; }
  render();
  try {
    if (/^B0[0-9A-Z]{8}$/.test(code)){
      item.asin = code; item.title = code;
    } else {
      const d = await api("/lookup?code=" + encodeURIComponent(code));
      const items = (d.items || []).map(mapCatalog);
      if (!items.length) throw new Error("No Amazon listing found for " + code + ".");
      item.matches = items;
      Object.assign(item, items[0]);
    }
    item.loading = false;
    item.sku = buildSku();
    render();
    loadGate(); loadOffers();
    if (item.price) queueFees();
  } catch(e){ item.loading = false; item.err = e.message; render(); }
}
function choose(i){
  const m = item.matches[i]; if (!m) return;
  Object.assign(item, m, {gate:null, offers:{}, fees:null, result:null});
  render(); loadGate(); loadOffers();
}

async function loadGate(){
  const it = item; it.gate = "wait"; renderSoon();
  try {
    const d = await api(`/restrictions?asin=${it.asin}&condition=${S.cond}`);
    if (it !== item) return;
    const r = (d.restrictions || []).flatMap(x => x.reasons || []);
    if (!r.length){ it.gate = "ok"; it.gateMsg = ""; it.gateLink = ""; }
    else {
      it.gate = "bad";
      it.gateMsg = r.map(x => x.message).filter(Boolean).join(" ");
      const link = r.flatMap(x => x.links || []).find(l => l.resource);
      it.gateLink = link ? link.resource : `https://sellercentral.amazon.com/hz/approvalrequest/restrictions/approve?asin=${it.asin}`;
    }
  } catch(e){ if (it !== item) return; it.gate = "err"; it.gateMsg = e.message; }
  render();
}

async function loadOffers(){
  const it = item, kind = condOf(S.cond).offer;
  if (it.offers[kind]){ render(); return; }
  it.offersErr = null; it.offersLoading = true; renderSoon();
  try {
    const d = await api(`/offers?asin=${it.asin}&itemCondition=${kind}`);
    if (it !== item) return;
    const list = ((d.payload && d.payload.Offers) || []).map(o => ({
      price: +(((o.ListingPrice && o.ListingPrice.Amount) || 0) + ((o.Shipping && o.Shipping.Amount) || 0)).toFixed(2),
      fba: !!o.IsFulfilledByAmazon, sub: String(o.SubCondition || "").replace(/_/g, " "), bb: !!o.IsBuyBoxWinner
    })).sort((a, b) => a.price - b.price);
    it.offers[kind] = list;
    // default price: lowest offer of the same channel, else lowest overall
    if (!it.price && list.length){
      const same = list.find(o => o.fba === (S.channel === "fba")) || list[0];
      it.price = same.price.toFixed(2);
      queueFees();
    }
  } catch(e){ if (it !== item) return; it.offersErr = e.message; }
  it.offersLoading = false;
  render();
}

function queueFees(){
  clearTimeout(feeTimer);
  feeTimer = setTimeout(loadFees, 600);
}
async function loadFees(){
  const it = item; if (!it || !it.asin) return;
  const price = parseFloat(it.price);
  if (!(price > 0)){ it.fees = null; renderMoney(); return; }
  it.feesErr = null;
  try {
    const d = await api(`/fees?asin=${it.asin}&price=${price}&fba=${S.channel === "fba" ? 1 : 0}`);
    if (it !== item) return;
    const est = d.payload && d.payload.FeesEstimateResult;
    if (est && est.Status === "Success"){ it.fees = est.FeesEstimate.TotalFeesEstimate.Amount; it.feesFor = price; }
    else { it.fees = null; it.feesErr = (est && est.Error && est.Error.Message) || "No fee estimate"; }
  } catch(e){ if (it !== item) return; it.fees = null; it.feesErr = e.message; }
  renderMoney();
}

// ---------- SKU ----------
function buildSku(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
  const cost = (parseFloat(item && item.cost) || 0).toFixed(2);
  const pattern = S.channel === "mf" ? S.skuMf : S.skuFba;
  return pattern
    .replace(/\{DATE\}/g, String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()))
    .replace(/\{COND\}/g, condOf(S.cond).short)
    .replace(/\{COST\}/g, cost)
    .replace(/\{RAND\}/g, rand)
    .replace(/\{TICKET\}/g, String(S.ticket).padStart(5, "0"))
    .replace(/\{SHELF\}/g, S.shelf)
    .replace(/\{SRC\}/g, ((item && item.source) || S.source || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6))
    .replace(/\s+/g, "").slice(0, 40);
}
function ticketTaken(n){ return S.listed.some(x => x.channel === "mf" && x.ticket === n) || S.batch.some(x => x.channel === "mf" && x.ticket === n && x.state !== "listed"); }
function nextTicket(){ do { S.ticket++; } while (ticketTaken(S.ticket)); }

// ---------- list it ----------
function snapshot(){
  return {code: item.code, asin: item.asin, title: item.title, img: item.img || "", productType: item.productType || null,
    cond: S.cond, channel: S.channel, price: parseFloat(item.price), cost: parseFloat(item.cost) || 0, note: (item.note || "").trim(),
    qty: Math.max(1, parseInt(item.qty) || 1), source: (item.source || "").trim(), sku: item.sku, rank: item.rank || null, pkgWeight: item.pkgWeight || null,
    fees: item.fees != null && item.feesFor === parseFloat(item.price) ? item.fees : null,
    ticket: S.channel === "mf" ? S.ticket : null, shelf: S.channel === "mf" ? S.shelf : null};
}
function checkSnap(sn){
  if (!(sn.price > 0)) return "Enter a price";
  if (!sn.sku) return "Enter a SKU";
  if (S.listed.some(x => x.sku === sn.sku) || S.batch.some(x => x.sku === sn.sku && x.state !== "listed")) return "That SKU was already used. Tap New SKU.";
  if (sn.channel === "mf" && ticketTaken(sn.ticket)) return "Ticket " + sn.ticket + " is already used. Change it in Settings.";
  return null;
}
// send one listing to Amazon; on success it goes into Listed
async function listOne(sn){
  try {
    const d = await api("/list", {method: "POST", body: JSON.stringify({
      sku: sn.sku, asin: sn.asin, productType: sn.productType || undefined, condition: sn.cond, note: sn.note, price: sn.price,
      fba: sn.channel === "fba", qty: sn.channel === "mf" ? sn.qty : undefined,
      attributes: sn.pkgWeight ? {item_package_weight: {value: sn.pkgWeight.value, unit: sn.pkgWeight.unit}} : undefined})});
    const errs = (d.issues || []).filter(i => i.severity === "ERROR");
    if (d.status === "ACCEPTED" && !errs.length){
      const entry = {at: Date.now(), sku: sn.sku, asin: sn.asin, productType: sn.productType, code: sn.code, title: sn.title,
        cond: sn.cond, channel: sn.channel, price: sn.price, cost: sn.cost, note: sn.note, rank: sn.rank, fees: sn.fees, qty: sn.qty || 1, source: sn.source || "",
        ticket: sn.ticket, shelf: sn.shelf, warnings: (d.issues || []).map(i => i.message)};
      S.listed.unshift(entry); rememberSource(entry.source); save(); syncSoon(); setTimeout(refreshStats, 0);
      watch(entry);
      return {ok: true, entry};
    }
    return {ok: false, status: d.status, msgs: (errs.length ? errs : (d.issues || [])).map(i => i.message + (i.attributeNames ? " (" + i.attributeNames.join(", ") + ")" : ""))};
  } catch(e){ return {ok: false, msgs: [e.message]}; }
}
async function listIt(){
  const sn = snapshot(), bad = checkSnap(sn);
  if (bad){ toast(bad); return; }
  item.busy = true; item.result = null; render();
  const r = await listOne(sn);
  if (r.ok && sn.channel === "mf") nextTicket();
  save();
  item.result = r; item.busy = false; render();
}
function addToBatch(){
  const sn = snapshot(), bad = checkSnap(sn);
  if (bad){ toast(bad); return; }
  sn.state = "ready";
  S.batch.push(sn);
  if (sn.channel === "mf") nextTicket();
  save();
  toast("Added · " + S.batch.filter(x => x.state !== "listed").length + " in batch");
  item = null; render(); const c = $("#code"); if (c) c.focus();
}
let batchBusy = false;
async function listAll(){
  if (batchBusy) return;
  const todo = S.batch.filter(x => x.state !== "listed");
  if (!todo.length) return;
  batchBusy = true;
  for (const sn of todo){
    sn.state = "listing"; sn.msg = ""; renderBatch();
    const r = await listOne(sn);
    if (r.ok){ sn.state = "listed"; } else { sn.state = "error"; sn.msg = r.msgs.join(" "); }
    save(); renderBatch();
    await new Promise(res => setTimeout(res, 300));
  }
  batchBusy = false; renderBatch();
  const okN = todo.filter(x => x.state === "listed").length, errN = todo.length - okN;
  toast(`Listed ${okN}` + (errN ? ` · ${errN} need fixing` : ""));
}
function batchEntries(){ return S.batch.filter(x => x.state === "listed").map(x => S.listed.find(e => e.sku === x.sku)).filter(Boolean); }

function renderBatch(){

// ---------- sync Listed + MF ticket between devices (Worker KV) ----------
let syncTimer = null, syncInfo = LS.get("syncInfo", null);
function syncSoon(){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, 800); }
async function sync(){
  if (!S.worker || !S.key) return;
  try {
    const d = await api("/sync", {method: "POST", body: JSON.stringify({listed: S.listed, ticket: S.ticket})});
    S.listed = d.listed || S.listed;
    S.ticket = Math.max(S.ticket, d.ticket || 1);
    while (ticketTaken(S.ticket)) S.ticket++;
    save();
    syncInfo = {ok: true, at: Date.now()};
  } catch(e){
    syncInfo = {ok: false, at: Date.now(), msg: e.status === 501 ? "Sync is off: the Worker has no KV storage named LISTED." : e.status === 404 ? "Sync is off: update the Worker code." : e.message};
  }
  LS.set("syncInfo", syncInfo);
  if (tab === "listed" && !editing) renderListed();
}
function syncLine(){
  if (!syncInfo) return "Not synced yet";
  const t = new Date(syncInfo.at).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  return syncInfo.ok ? `<span class="pos">✓ Synced ${t}</span>` : `<span class="neg">${esc(syncInfo.msg)}</span>`;

// ---------- check a listing on Amazon ----------
async function checkStatus(entry){
  const st = {at: Date.now()};
  try {
    const d = await api("/status?sku=" + encodeURIComponent(entry.sku));
    const sum = (d.summaries || [])[0] || {};
    const flags = sum.status || [];
    const errs = (d.issues || []).filter(i => i.severity === "ERROR");
    const warns = (d.issues || []).filter(i => i.severity !== "ERROR");
    const fa = (d.fulfillmentAvailability || [])[0] || {};
    st.qty = fa.quantity;
    st.chan = fa.fulfillmentChannelCode ? (/^AMAZON/.test(fa.fulfillmentChannelCode) ? "FBA" : "FBM") : null;
    const off = (d.offers || [])[0];
    st.price = off && off.price ? Number(off.price.amount ?? off.price.Amount) : null;
    st.fnsku = sum.fnSku || null;
    if (sum.productType) entry.productType = sum.productType;
    st.msgs = errs.concat(warns).map(i => i.message);
    if (errs.length){ st.state = "error"; st.label = "Problem on Amazon"; }
    else if (st.price == null){ st.state = "inactive"; st.label = "Listed · price not applied yet"; }
    else if (flags.includes("BUYABLE")){ st.state = "active"; st.label = "Active · buyers can see it"; }
    else if (entry.channel === "fba"){ st.state = "inactive"; st.label = "Listed · inactive until Amazon gets your stock"; }
    else { st.state = "inactive"; st.label = "Listed · inactive"; }
  } catch(e){
    if (e.status === 404 && e.message === "not found"){ st.state = "fail"; st.label = "Worker needs the update"; st.msgs = ["Paste the newest Worker code into Cloudflare and Deploy."]; }
    else if (e.status === 404){ st.state = "missing"; st.label = "Not found on Amazon yet"; st.msgs = ["New listings can take up to 15 minutes to show up. If it's still missing later, check Fix Your Products."]; }
    else { st.state = "fail"; st.label = "Couldn't check"; st.msgs = [e.message]; }
  }
  entry.status = st; save(); syncSoon();
  return st;
}
async function fixListing(entry, quiet){
  try {
    const d = await api("/fix", {method: "POST", body: JSON.stringify({sku: entry.sku, productType: entry.productType || undefined,
      price: entry.price, fba: entry.channel === "fba", qty: entry.channel === "mf" ? 1 : undefined})});
    const errs = (d.issues || []).filter(i => i.severity === "ERROR");
    if (quiet) return;
    if (d.status === "ACCEPTED" && !errs.length) toast("Sent. Check again in a few minutes.");
    else toast("Amazon: " + ((errs[0] || (d.issues || [])[0] || {}).message || d.status));
  } catch(e){
    if (!quiet) toast(e.status === 404 && e.message === "not found" ? "Update the Worker first" : e.message);
  }
}
function statusHTML(st){
  if (!st) return "";
  const cls = st.state === "active" ? "pos" : st.state === "error" || st.state === "fail" ? "neg" : "";
  const icon = st.state === "active" ? "✓" : st.state === "error" ? "⚠" : st.state === "missing" ? "…" : st.state === "fail" ? "✗" : "●";

const LABELS = {

  "30252": {name: "Dymo 30252 · 3.5\" x 1.125\"", w: 3.5, h: 1.125},

const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128Svg(text){
  const data = [...text].map(ch => ch.charCodeAt(0) - 32);
  if (data.some(v => v < 0 || v > 94)) throw new Error("Bad characters in " + text);
  const vals = [104].concat(data);
  let sum = 104; for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103, 106);
  const widths = vals.map(v => C128[v]).join("");
  const quiet = 10; let x = quiet, rects = "";
  for (let i = 0; i < widths.length; i++){
    const w = +widths[i];
    if (i % 2 === 0) rects += `<rect x="${x}" y="0" width="${w}" height="40"/>`;
    x += w;
  }
  return `<svg viewBox="0 0 ${x + quiet} 40" preserveAspectRatio="none" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

// After listing, ask Amazon every 30s until the listing has its FNSKU (FBA) and price.
// If the price still hasn't stuck after ~4 minutes, re-send price & channel once by itself.
const watching = new Map();   // sku -> {tries, fixed}
let watchTimer = null;
function watch(entry){
  watching.set(entry.sku, {tries: 0, fixed: false});
  if (!watchTimer) watchTimer = setTimeout(watchRound, 20000);
}
async function watchRound(){
  watchTimer = null;
  for (const [sku, w] of [...watching]){
    const entry = S.listed.find(x => x.sku === sku);
    if (!entry || entry.deleted){ watching.delete(sku); continue; }
    w.tries++;
    await checkStatus(entry);
    const st = entry.status || {};
    const priced = "price" in st && st.price != null;
    if (!priced && !w.fixed && w.tries >= 8 && st.state !== "missing" && st.state !== "fail"){ w.fixed = true; await fixListing(entry, true); }
    const doneFba = entry.channel !== "fba" || st.fnsku;
    if ((doneFba && priced) || w.tries >= 30) watching.delete(sku);
    if (entry.channel === "fba" && st.fnsku && !w.buzzed){ w.buzzed = true; if (navigator.vibrate) navigator.vibrate([60, 60, 60]); }
    updateWatchUI(entry);
    await new Promise(r => setTimeout(r, 400));
  }
  renderBatch();
  if (tab === "listed" && !editing) renderListed();
  if (watching.size) watchTimer = setTimeout(watchRound, 30000);
}
function updateWatchUI(entry){
  if (!item || !item.result || !item.result.ok || item.result.entry.sku !== entry.sku) return;
  item.result.entry = entry;
  const box = $("#checkRes"); if (box) box.innerHTML = statusHTML(entry.status);
  const pb = $("#printLbl");
  if (pb && entry.channel === "fba"){
    if (entry.status && entry.status.fnsku){ pb.disabled = false; pb.textContent = "Print label · " + entry.status.fnsku; }
    else if (!watching.has(entry.sku)){ pb.disabled = false; pb.textContent = "Print label (type FNSKU)"; }
  }
}

// ---------- camera (same method as Scout: own decode loop on the box area) ----------
let stream = null, camTimer = null, camSession = 0, native = null, zxReader = null, wideTick = 0, torchOn = false;
const scanCanvas = document.createElement("canvas");
const streamLive = () => stream && stream.getVideoTracks().some(t => t.readyState === "live");
function getZx(){
  if (zxReader || typeof ZXing === "undefined") return zxReader;
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.EAN_8]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  zxReader = new ZXing.MultiFormatReader(); zxReader.setHints(hints);
  return zxReader;
}
// map the green box on screen to the same area of the camera picture (picture is cropped to fill the screen)
function boxInVideo(video){
  const vw = video.videoWidth, vh = video.videoHeight;
  const v = video.getBoundingClientRect(), r = document.querySelector("#cam .reticle").getBoundingClientRect();
  if (!v.width || !r.width) return {sx:vw*0.08, sy:vh*0.38, sw:vw*0.84, sh:vh*0.22};
  const k = Math.max(v.width/vw, v.height/vh), ox = (v.width - vw*k)/2, oy = (v.height - vh*k)/2;
  let sx = (r.left - v.left - ox)/k, sy = (r.top - v.top - oy)/k, sw = r.width/k, sh = r.height/k;
  sx = Math.max(0, sx); sy = Math.max(0, sy); sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
  return {sx, sy, sw, sh};
}
function zxDecode(video, area){
  const {sx, sy, sw, sh} = area;
  const scale = Math.min(1, 1280/sw), w = Math.round(sw*scale), h = Math.round(sh*scale);
  if (!w || !h) return null;
  scanCanvas.width = w; scanCanvas.height = h;
  const g = scanCanvas.getContext("2d", {willReadFrequently:true});
  g.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w*h);
  for (let i = 0, j = 0; j < lum.length; i += 4, j++) lum[j] = (d[i]*77 + d[i+1]*150 + d[i+2]*29) >> 8;
  try { return getZx().decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(lum, w, h)))).getText(); }
  catch(e){ return null; }
}
function freshVideo(){
  // iPhone Safari can freeze a reused <video>, so swap in a new one each time
  const old = $("#video"), v = document.createElement("video");
  v.id = "video"; v.autoplay = true; v.muted = true; v.playsInline = true;
  v.setAttribute("autoplay", ""); v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
  old.replaceWith(v);
  return v;
}
async function openCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("Camera needs https."); return; }
  if (!window.ZXing && !("BarcodeDetector" in window)){ toast("Scanner didn't load. Reload the page."); return; }
  if (native === null && "BarcodeDetector" in window){
    try { const f = await BarcodeDetector.getSupportedFormats(); native = f.includes("ean_13") ? new BarcodeDetector({formats:["ean_13","upc_a","upc_e","ean_8"].filter(x => f.includes(x))}) : false; } catch(e){ native = false; }
  }
  $("#cam").hidden = false;
  if (!streamLive()){
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    try { stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}}); }
    catch(e){ $("#cam").hidden = true; toast("Camera blocked. Settings > Safari > Camera > Allow."); return; }
    try { await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:"continuous"}]}); } catch(e){}
  }
  try { const c = stream.getVideoTracks()[0].getCapabilities(); $("#torchBtn").hidden = !c.torch; } catch(e){ $("#torchBtn").hidden = true; }
  const video = freshVideo();
  video.srcObject = stream;
  try { await video.play(); } catch(e){}
  const session = ++camSession;
  const tick = async () => {
    if (session !== camSession || $("#cam").hidden || !streamLive()) return;
    if (video.readyState >= 2 && video.videoWidth){
      let code = null;
      try {
        if (native){ const r = await native.detect(video); if (r && r.length) code = r[0].rawValue; }
        else if (window.ZXing){
          code = zxDecode(video, boxInVideo(video));
          if (!code && (++wideTick % 4 === 0)){ const vw = video.videoWidth, vh = video.videoHeight; code = zxDecode(video, {sx:vw*0.05, sy:vh*0.30, sw:vw*0.90, sh:vh*0.40}); }
        }
      } catch(e){ zxReader = null; }
      if (session !== camSession) return;
      if (code){
        if (navigator.vibrate) navigator.vibrate(60);
        closeCam();
        const c = $("#code"); if (c) c.value = code;
        lookup(code);
        return;
      }
    } else if (video.paused){ try { await video.play(); } catch(e){} }
    camTimer = setTimeout(tick, native ? 80 : 30);
  };
  tick();
}
function closeCam(){
  camSession++;
  clearTimeout(camTimer); camTimer = null;
  if (torchOn){ torchOn = false; try { stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:false}]}); } catch(e){} }
  const v = $("#video"); try { v.pause(); } catch(e){}
  $("#cam").hidden = true;
}
function stopStream(){
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = $("#video"); if (v) v.srcObject = null;
}
document.addEventListener("visibilitychange", () => { if (document.hidden){ closeCam(); stopStream(); } });
$("#camClose").onclick = closeCam;
$("#torchBtn").onclick = async () => {
  torchOn = !torchOn;
  try { await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]}); } catch(e){ torchOn = false; }
  $("#torchBtn").textContent = torchOn ? "Light off" : "Light";
};

function statsRows(){
  if (S.statsScope === "batch") return S.batch.map(x => x.state === "listed" ? (S.listed.find(e => e.sku === x.sku) || x) : x);
  if (S.statsScope === "all") return live().filter(x => !x.soldAt);
  const today = new Date().toDateString();
  return live().filter(x => new Date(x.at).toDateString() === today);
}
const kfmt = n => n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(Math.round(n));
function statsHTML(){
  const rows = statsRows();
  const units = rows.reduce((a, x) => a + (x.qty || 1), 0);
  const ranks = rows.map(x => x.rank).filter(r => r > 0);
  const avgRank = ranks.length ? ranks.reduce((a, r) => a + r, 0) / ranks.length : null;
  const value = rows.reduce((a, x) => a + (x.price || 0) * (x.qty || 1), 0);
  const cost = rows.reduce((a, x) => a + (x.cost || 0) * (x.qty || 1), 0);
  const withFees = rows.filter(x => x.fees != null);
  const profit = withFees.reduce((a, x) => a + ((x.price || 0) - x.fees - (x.cost || 0)) * (x.qty || 1), 0);
  const tile = (icon, label, val, color, cls) => `<div class="stat" style="--bar:${color}"><div class="k">${icon} ${label}</div><div class="v num ${cls || ""}">${val}</div></div>`;
  return `<div id="statsBar">
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <div class="seg" id="scope">${[["today","Today"],["batch","Batch"],["all","All active"]].map(([k, l]) => `<button data-scope="${k}" aria-pressed="${S.statsScope === k}">${l}</button>`).join("")}</div>
    </div>
    <div class="stats6">
      ${tile("▦", "Items", units, "#8d98a4")}
      ${tile("▤", "SKUs", rows.length, "#38bdf8")}
      ${tile("↗", "Avg rank", kfmt(avgRank), "#2b8fc9")}
      ${tile("◇", "Sales value", money(value), "#6b7280")}
      ${tile("⊖", "Cost", money(cost), "#e5534b")}
      ${tile("$", "Profit", withFees.length ? money(profit) : "—", "#22c55e", profit >= 0 ? "pos" : "neg")}
    </div>
    ${rows.length && withFees.length < rows.length ? `<div class="note" style="margin-top:4px">Profit counts ${withFees.length} of ${rows.length} books (the rest had no fee estimate).</div>` : ""}
  </div>`;
}

function exportCsv(){
  const cols = ["date","sku","asin","code","title","channel","condition","price","cost","qty","source","ticket","shelf","amazon_status"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [cols.join(",")].concat(live().map(x => [new Date(x.at).toISOString(), x.sku, x.asin, x.code, x.title, x.channel, x.cond, x.price, x.cost, x.qty || 1, x.source || "", x.ticket, x.shelf, x.status ? x.status.label : ""].map(q).join(",")));
  const blob = new Blob([lines.join("\n")], {type: "text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "bethany-listed.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

const MKT = "ATVPDKIKX0DER";
const IB = "/inbound/fba/2024-03-20";
const sleep = ms => new Promise(r => setTimeout(r, ms));
function spCall(method, path, body){ return api("/sp", {method: "POST", body: JSON.stringify({method, path, body})}); }
// Amazon runs most shipment steps in the background: wait for the operation to finish
async function waitOp(r){
  const id = r && r.operationId; if (!id) return r;
  for (let i = 0; i < 80; i++){
    await sleep(i < 4 ? 1500 : 3000);
    const st = await spCall("GET", `${IB}/operations/${id}`);
    if (st.operationStatus === "SUCCESS") return st;
    if (st.operationStatus === "FAILED") throw new Error((st.operationProblems || []).map(p => p.message).join(" ") || "Amazon couldn't finish this step.");
  }
  throw new Error("Amazon is taking a long time. Tap Continue to keep going.");
}

let shipBusy = false;
const shipables = () => live().filter(x => x.channel === "fba" && !x.shippedAt);
function shipLog(msg){ S.ship.log = (S.ship.log || []).concat([{at: Date.now(), msg}]).slice(-30); save(); }
async function startShipment(skus){
  const f = S.shipFrom;
  if (!f.name || !f.address1 || !f.city || !f.state || !f.zip || !f.phone){ toast("Add your ship-from address in Settings first"); tab = "settings"; render(); return; }
  S.ship = {at: Date.now(), skus, step: "plan", done: {}, box: {...S.box}, log: []};
  save(); runShipment();
}
async function runShipment(){
  if (shipBusy || !S.ship) return;
  shipBusy = true; S.ship.error = null; renderShipSoon();
  const sh = S.ship;
  try {
    if (!sh.done.plan){
      const f = S.shipFrom;
      const r = await spCall("POST", `${IB}/inboundPlans`, {
        name: "Bethany " + new Date().toLocaleDateString(),
        destinationMarketplaces: [MKT],
        sourceAddress: {name: f.name, addressLine1: f.address1, ...(f.address2 ? {addressLine2: f.address2} : {}), city: f.city,
          stateOrProvinceCode: f.state.toUpperCase(), postalCode: f.zip, countryCode: "US", phoneNumber: f.phone},
        items: sh.skus.map(msku => ({msku, quantity: (S.listed.find(x => x.sku === msku) || {}).qty || 1, prepOwner: "NONE", labelOwner: "SELLER"})),
      });
      sh.planId = r.inboundPlanId; save();
      await waitOp(r);
      sh.done.plan = true; sh.step = "packing"; shipLog("Plan " + sh.planId); save(); renderShipSoon();
    }
    if (!sh.done.packing){
      await waitOp(await spCall("POST", `${IB}/inboundPlans/${sh.planId}/packingOptions`));
      const lp = await spCall("GET", `${IB}/inboundPlans/${sh.planId}/packingOptions`);
      const opt = (lp.packingOptions || []).find(o => o.status === "OFFERED") || (lp.packingOptions || [])[0];
      if (!opt) throw new Error("Amazon didn't offer a packing option.");
      sh.packingGroups = opt.packingGroups || [];
      await waitOp(await spCall("POST", `${IB}/inboundPlans/${sh.planId}/packingOptions/${opt.packingOptionId}/confirmation`));
      sh.done.packing = true; sh.step = "boxes"; save(); renderShipSoon();
    }
    if (!sh.done.boxes){
      const groups = [];
      for (const g of sh.packingGroups){
        const gi = await spCall("GET", `${IB}/inboundPlans/${sh.planId}/packingGroups/${g}/items`);
        groups.push({id: g, items: (gi.items || []).map(i => ({msku: i.msku, quantity: i.quantity, prepOwner: i.prepInstructions && i.prepInstructions.some(p => p.prepOwner === "SELLER") ? "SELLER" : "NONE", labelOwner: i.labelOwner || "SELLER"}))});
      }
      const total = groups.reduce((a, g) => a + g.items.reduce((b, i) => b + i.quantity, 0), 0) || 1;
      const b = sh.box;
      await waitOp(await spCall("POST", `${IB}/inboundPlans/${sh.planId}/packingInformation`, {
        packageGroupings: groups.map(g => ({packingGroupId: g.id, boxes: [{
          contentInformationSource: "BOX_CONTENT_PROVIDED",
          dimensions: {length: +b.l, width: +b.w, height: +b.h, unitOfMeasurement: "IN"},
          weight: {unit: "LB", value: Math.max(0.5, +(b.lb * g.items.reduce((a, i) => a + i.quantity, 0) / total).toFixed(2))},
          quantity: 1, items: g.items}]}))
      }));
      sh.boxes = groups.length;
      sh.boxList = groups.map(g => g.items.map(i => i.msku));
      sh.done.boxes = true; sh.step = "placement"; save(); renderShipSoon();
    }
    if (!sh.done.placement){
      await waitOp(await spCall("POST", `${IB}/inboundPlans/${sh.planId}/placementOptions`));
      const lp = await spCall("GET", `${IB}/inboundPlans/${sh.planId}/placementOptions`);
      const fee = o => (o.fees || []).reduce((a, f) => a + Number((f.value && f.value.amount) || 0), 0);
      const opts = (lp.placementOptions || []).filter(o => o.status !== "EXPIRED").sort((a, c) => fee(a) - fee(c));
      if (!opts.length) throw new Error("Amazon didn't offer a warehouse option.");
      sh.placementOptionId = opts[0].placementOptionId; sh.shipmentIds = opts[0].shipmentIds || []; sh.placementFee = fee(opts[0]);
      sh.done.placement = true; sh.step = "transport"; save(); renderShipSoon();
    }
    if (!sh.done.transport){
      await waitOp(await spCall("POST", `${IB}/inboundPlans/${sh.planId}/transportationOptions`, {
        placementOptionId: sh.placementOptionId,
        shipmentTransportationConfigurations: sh.shipmentIds.map(shipmentId => ({shipmentId, readyToShipWindow: {start: new Date().toISOString()}}))
      }));
      const lt = await spCall("GET", `${IB}/inboundPlans/${sh.planId}/transportationOptions?placementOptionId=${sh.placementOptionId}&pageSize=20`);
      const all = lt.transportationOptions || [];
      const cost = o => Number((o.quote && o.quote.cost && o.quote.cost.amount) || 0);
      sh.selections = []; sh.carrierCost = 0; sh.carrier = "";
      for (const id of sh.shipmentIds){
        const mine = all.filter(o => o.shipmentId === id && o.shippingMode === "GROUND_SMALL_PARCEL");
        const pick = mine.filter(o => o.shippingSolution === "AMAZON_PARTNERED_CARRIER").sort((a, c) => cost(a) - cost(c))[0] || mine[0];
        if (!pick) throw new Error("Amazon didn't offer small-parcel shipping for this box.");
        sh.selections.push({shipmentId: id, transportationOptionId: pick.transportationOptionId});
        sh.carrierCost += cost(pick);
        sh.carrier = pick.shippingSolution === "AMAZON_PARTNERED_CARRIER" ? ((pick.carrier && pick.carrier.name) || "UPS") + " (Amazon rate)" : "Your own carrier";
      }
      sh.done.transport = true; sh.step = "confirm"; save(); renderShipSoon();
    }
    if (!sh.done.confirm){
      if (!sh.approved){ shipBusy = false; renderShipSoon(); return; }   // wait for the button
      await waitOp(await spCall("POST", `${IB}/inboundPlans/${sh.planId}/placementOptions/${sh.placementOptionId}/confirmation`));
      await waitOp(await spCall("POST", `${IB}/inboundPlans/${sh.planId}/transportationOptions/confirmation`, {transportationSelections: sh.selections}));
      sh.confirmIds = [];
      for (const id of sh.shipmentIds){
        const g = await spCall("GET", `${IB}/inboundPlans/${sh.planId}/shipments/${id}`);
        if (g.shipmentConfirmationId) sh.confirmIds.push(g.shipmentConfirmationId);
      }
      for (const sku of sh.skus){ const e = S.listed.find(x => x.sku === sku); if (e){ e.shippedAt = Date.now(); e.shipment = sh.confirmIds.join(", "); e.editedAt = Date.now(); } }
      syncSoon();
      sh.done.confirm = true; sh.step = "labels"; save(); renderShipSoon();
    }
    if (!sh.done.labels){
      sh.labelUrls = [];
      for (let k = 0; k < sh.confirmIds.length; k++){
        const cid = sh.confirmIds[k];
        let n = sh.shipmentIds.length === 1 ? (sh.boxes || 1) : 1;
        try { const bx = await spCall("GET", `${IB}/inboundPlans/${sh.planId}/shipments/${sh.shipmentIds[k]}/boxes`); if ((bx.boxes || []).length) n = bx.boxes.length; } catch(e){}
        const r = await spCall("GET", `/fba/inbound/v0/shipments/${cid}/labels?PageType=${S.boxPage}&LabelType=UNIQUE&NumberOfPackages=${n}`);
        const url = r.payload && r.payload.DownloadURL;
        if (url) sh.labelUrls.push({cid, url});
      }
      if (!sh.labelUrls.length) throw new Error("Amazon hasn't made the box labels yet. Tap Continue in a minute.");
      sh.done.labels = true; sh.step = "done"; save();
    }
  } catch(e){
    sh.error = e.status === 404 && e.message === "not found" ? "Update the Worker first." : e.message;
    shipLog("Error: " + sh.error); save();
  }
  shipBusy = false; renderShipSoon();
}
async function cancelShipment(){
  const sh = S.ship; if (!sh) return;
  if (sh.done.confirm){ toast("This shipment is confirmed. Cancel it in Seller Central if needed."); return; }
  if (!confirm("Cancel this shipment plan?")) return;
  if (sh.planId){ try { await spCall("PUT", `${IB}/inboundPlans/${sh.planId}/cancellation`); } catch(e){} }
  S.ship = null; save(); render();
}

    num("#bL", "l"); num("#bW", "w"); num("#bH", "h"); num("#bLb", "lb");

  const idx = SHIP_STEPS.findIndex(s => s[0] === sh.step);

  m.innerHTML = `

    <div class="card">${SHIP_STEPS.map(([k, label], i) => {
      const done = sh.done[k], cur = i === idx || (sh.step === "done" && false);
      const icon = done ? '<span class="pos">✓</span>' : cur && shipBusy ? '<span class="spin"></span>' : cur && sh.error ? '<span class="neg">✗</span>' : '<span class="note">○</span>';
      return `<div class="row" style="padding:5px 0"><b style="width:20px">${icon}</b><span${done ? "" : ' class="note"'}>${label}</span></div>`;

    ${sh.boxList && sh.boxList.length > 1 ? `<div class="card"><b>Amazon wants ${sh.boxList.length} separate boxes</b>
      ${sh.boxList.map((skus, i) => `<div class="m" style="margin-top:6px"><b>Box ${i + 1}:</b> ${skus.map(k => esc((S.listed.find(x => x.sku === k) || {title: k}).title)).join(" · ")}</div>`).join("")}
      <div class="note" style="margin-top:6px">Pack each box with only its books. Weight was split by book count.</div></div>` : ""}

// ---------- Sales: orders, real fees, profit ----------
let salesBusy = false, salesMsg = "";
async function loadSales(){
  if (salesBusy) return;
  salesBusy = true; salesMsg = "Getting orders…"; renderSalesSoon();
  try {
    const after = new Date(Date.now() - S.salesDays * 864e5).toISOString().slice(0, 19) + "Z";
    let next = null, orders = [], pages = 0;
    do {
      const q = next ? `NextToken=${encodeURIComponent(next)}&MarketplaceIds=${MKT}` : `MarketplaceIds=${MKT}&CreatedAfter=${after}&MaxResultsPerPage=100`;
      const r = await spCall("GET", `/orders/v0/orders?${q}`);
      const p = r.payload || {};
      orders = orders.concat(p.Orders || []); next = p.NextToken; pages++;
      if (next) await sleep(1100);
    } while (next && pages < 5);
    for (const o of orders){
      const id = o.AmazonOrderId, old = S.orders[id] || {};
      S.orders[id] = {...old, id, date: o.PurchaseDate, status: o.OrderStatus, channel: o.FulfillmentChannel, total: Number((o.OrderTotal && o.OrderTotal.Amount) || 0), latestShip: o.LatestShipDate};
    }
    // details for new orders, and real fees once Amazon has posted them
    const need = Object.values(S.orders).filter(o => !o.items || (!o.feesFinal && o.status !== "Canceled" && o.status !== "Pending"));
    let n = 0;
    for (const o of need){
      if (n >= 40) break;
      salesMsg = `Reading order ${++n} of ${Math.min(need.length, 40)}…`; renderSalesSoon();
      if (!o.items){
        const it = await spCall("GET", `/orders/v0/orders/${o.id}/orderItems`);
        o.items = ((it.payload && it.payload.OrderItems) || []).map(i => ({sku: i.SellerSKU, title: i.Title, qty: i.QuantityOrdered, price: Number((i.ItemPrice && i.ItemPrice.Amount) || 0)}));
      }
      if (o.status === "Shipped" || o.status === "PartiallyShipped"){
        const fe = await spCall("GET", `/finances/v0/orders/${o.id}/financialEvents`);
        const ev = (fe.payload && fe.payload.FinancialEvents && fe.payload.FinancialEvents.ShipmentEventList) || [];
        let fees = 0, got = false;
        for (const e of ev) for (const si of (e.ShipmentItemList || [])) for (const f of (si.ItemFeeList || [])){ fees += -Number((f.FeeAmount && f.FeeAmount.CurrencyAmount) || 0); got = true; }
        if (got){ o.fees = +fees.toFixed(2); o.feesFinal = true; }
      }
      S.orders[o.id] = o; save();
      await sleep(n > 20 ? 2100 : 300);
    }
    // mark sold books in Listed
    for (const o of Object.values(S.orders)) if (o.status !== "Canceled") for (const i of (o.items || [])){ const e = S.listed.find(x => x.sku === i.sku); if (e && !e.soldAt){ e.soldAt = Date.parse(o.date) || Date.now(); e.editedAt = Date.now(); } }
    save(); syncSoon();
    salesMsg = `Updated ${new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})}` + (need.length > 40 ? " · tap Refresh for more" : "");
  } catch(e){ salesMsg = e.status === 404 && e.message === "not found" ? "Update the Worker first." : "Couldn't load sales: " + e.message; }
  salesBusy = false; renderSalesSoon();
}
let salesSoon = 0;
function renderSalesSoon(){ if (tab !== "sales") return; cancelAnimationFrame(salesSoon); salesSoon = requestAnimationFrame(renderSales); }
function renderSales(){
  const since = Date.now() - S.salesDays * 864e5;
  const orders = Object.values(S.orders).filter(o => Date.parse(o.date) >= since).sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
  const lines = [];
  for (const o of orders){
    if (o.status === "Canceled") continue;
    const items = o.items || [{sku: "", title: "(loading)", qty: 1, price: o.total}];
    const itemTotal = items.reduce((a, i) => a + i.price, 0) || 1;
    for (const i of items){
      const e = S.listed.find(x => x.sku === i.sku);
      const share = i.price / itemTotal;
      const fees = o.fees != null ? o.fees * share : null;
      const cost = e ? e.cost * (i.qty || 1) : null;
      lines.push({o, i, e, fees, cost, profit: fees != null && cost != null ? i.price - fees - cost : null});
    }
  }
  const sum = k => lines.reduce((a, l) => a + (l[k] || 0), 0);
  const sales = lines.reduce((a, l) => a + l.i.price, 0), units = lines.reduce((a, l) => a + (l.i.qty || 1), 0);
  const pick = orders.filter(o => o.channel === "MFN" && (o.status === "Unshipped" || o.status === "PartiallyShipped"));
  $("#main").innerHTML = `
    <h2>Sales</h2>
    <div class="row"><select id="sDays" style="flex:1">${[7, 30, 90].map(d => `<option value="${d}" ${S.salesDays === d ? "selected" : ""}>Last ${d} days</option>`).join("")}</select>
      <button class="btn pri" id="sLoad" ${salesBusy ? "disabled" : ""}>${salesBusy ? '<span class="spin"></span>' : "Refresh"}</button></div>
    <div class="note" style="margin-top:6px">${esc(salesMsg)}</div>
    <div class="money">
      <div><div class="v num">${units}</div><span class="label">Sold</span></div>
      <div><div class="v num">${money(sales)}</div><span class="label">Sales</span></div>
      <div><div class="v num">${money(sum("fees"))}</div><span class="label">Fees</span></div>
      <div><div class="v num ${sum("profit") >= 0 ? "pos" : "neg"}">${money(sum("profit"))}</div><span class="label">Profit</span></div>
    </div>
    <div class="note" style="margin-top:4px">Profit = price − Amazon's actual fees − your buy cost. Fees show once the order ships. Books not listed through the Lister have no cost, so they're left out of profit.</div>
    ${pick.length ? `<h2>MF to ship (${pick.length})</h2><div class="list">${pick.map(o => (o.items || []).map(i => { const e = S.listed.find(x => x.sku === i.sku); return `
      <div class="item" style="border-color:var(--accent)"><div class="t">${esc(i.title)}</div>
        <div class="m">${e && e.ticket ? `<b style="color:var(--accent)">Ticket #${String(e.ticket).padStart(5, "0")} · shelf ${esc(e.shelf)}</b> · ` : ""}${esc(i.sku)} · ship by ${o.latestShip ? new Date(o.latestShip).toLocaleDateString() : "—"}</div>
        <div class="m"><a target="_blank" rel="noopener" style="color:var(--blue)" href="https://sellercentral.amazon.com/orders-v3/order/${esc(o.id)}">Open order ${esc(o.id)}</a></div></div>`; }).join("")).join("")}</div>` : ""}
    <h2>Orders</h2>
    <div class="list">${lines.map(l => `
      <div class="item">
        <div class="t">${esc(l.i.title)}</div>
        <div class="m"><span class="tag ${l.o.channel === "AFN" ? "fba" : "mf"}">${l.o.channel === "AFN" ? "FBA" : "MF"}</span> ${new Date(l.o.date).toLocaleDateString()} · ${esc(l.o.status)} · <span class="num">${esc(l.i.sku)}</span></div>
        <div class="m">Price ${money(l.i.price)} · fees ${l.fees != null ? money(l.fees) : "pending"} · cost ${l.cost != null ? money(l.cost) : "—"} · <b class="${l.profit == null ? "" : l.profit >= 0 ? "pos" : "neg"}">profit ${money(l.profit)}</b></div>
      </div>`).join("") || `<div class="note" style="margin-top:12px">${salesBusy ? "" : "No orders in this period yet."}</div>`}</div>`;
  $("#sDays").onchange = e => { S.salesDays = +e.target.value; save(); renderSales(); loadSales(); };
  $("#sLoad").onclick = loadSales;
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
const start = new URLSearchParams(location.search).get("code");
if (!S.key){ tab = "settings"; render(); toast("Enter your app key to connect"); }
else if (start) lookup(start);
if (S.key){
  sync();
  // keep watching recent listings that still need an FNSKU or price after the app was closed
  const dayAgo = Date.now() - 864e5;
  live().filter(x => x.at > dayAgo && (!(x.status && "price" in x.status && x.status.price != null) || (x.channel === "fba" && !(x.status && x.status.fnsku)))).forEach(watch);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.key) sync(); });
</script>
</body>
</html>
